    <style>
        :root { --bg-primary: #060b14; --bg-secondary: #0b1221; --bg-card: #0f1729; --bg-card-hover: #131d33; --border-subtle: rgba(255,255,255,0.06); --border-medium: rgba(255,255,255,0.12); --border-active: rgba(56,189,248,0.4); --text-primary: #e8ecf2; --text-secondary: #9aa4b8; --text-muted: #5f6b80; --accent: #38bdf8; --green: #10b981; --red: #ef4444; --amber: #f59e0b; --gold: #fbbf24; --rose: #f43f5e; --purple: #a855f7; --percent-accent: #00E5FF; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --shadow-card: 0 4px 24px rgba(0,0,0,0.4); --font-xs: 0.6rem; --font-sm: 0.68rem; --font-md: 0.78rem; --font-lg: 0.9rem; color-scheme: dark; }

        .pwr-popover, .search-popover, .messages-popover { position:fixed; z-index:200; display:none; max-width:380px; width:calc(100vw - 24px); background:rgba(15,23,42,0.97); border:1px solid rgba(51,65,85,0.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.6); overflow:hidden; font-size:var(--font-sm); }
        .pwr-popover.show, .search-popover.show, .messages-popover.show { display:block; }
        .pwr-popover-header, .search-popover-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid rgba(51,65,85,0.4); font-size:0.62rem; }

        .pwr-search-btn { width:26px; height:26px; border-radius:50%; background:rgba(30,41,59,0.8); border:1px solid var(--border-medium); color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.6rem; }
        .hero-section { background: rgba(15,23,42,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border:1px solid rgba(255,255,255,0.08); border-radius:20px; box-shadow:0 12px 32px rgba(0,0,0,0.35); padding: 18px 20px; margin-bottom:12px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; overflow: hidden; min-height: 90px; }
        .hero-bg-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 120px; color: var(--accent); opacity: 0.06; pointer-events: none; animation: heroPulse 4s ease-in-out infinite; }

        .claim-btn.accent { background:linear-gradient(135deg,#10b981,#059669); border:none; color:#fff; }
        .claim-btn:disabled { opacity:0.5; cursor:not-allowed; background:var(--bg-secondary); color:var(--text-muted); border:1px solid var(--border-medium); }

        #sortDropdown { right:0; left:auto; }

            if (!text) return '';

                let processed = line;

        async function processMentions(text, sourceType, sourceId, sourceTitle) {
            if (!text) return;
            const mentionRegex = /@([a-zA-Z0-9_]+)/g;
            const mentioned = new Set();
            let match;
            while ((match = mentionRegex.exec(text)) !== null) {
                const name = match[1].toLowerCase();
                if (name === (pwrCache.username||'').toLowerCase()) continue;
                mentioned.add(name);

            for (const name of mentioned) {
                try {
                    let snap = await db.ref('usernames/'+name).once('value');

                        const allUsersSnap = await db.ref('users').once('value');

        const userRef = db.ref('users/' + userId);
        let pwrCache = { balance: 1000, lastClaim: 0, history: [], streakDay: 0, lastClaimDate: '', username: '', showBalance: true, usdtAddress: '', publicId: '', createdAt: 0, contactInfo: [], unreadMessages: 0, referredBy: '', referralBonusClaimed: false, referralsCount: 0, usdtNetwork: '', isAdmin: isAdmin };

            const params = new URLSearchParams(location.search);
            if (params.get('p') || params.get('u')) return;
            setTimeout(()=>startOnboarding(), 1200);
        }
        let onboardingStep = 0;
        const onboardingSteps = [
            { sel:'#pwrBadge', title:'Welcome to Sentix', text:'You received 1,000 PWR. Tap the badge to view balance, claim daily, and see transactions.' },
            { sel:'.fab', title:'Create', text:'Tap + to create a post or poll with options, media, and PWR rewards.' },
            { sel:'#pollFeed', title:'Vote & Comment', text:'Open any poll to vote, comment, react, and favorite.' },
            { sel:'#searchToggleBtn', title:'Universal Search', text:'Search by keywords, IDs, usernames, dates, media, PWR, and more.' },
            { sel:'#moreBtn', title:'More Menu', text:'Find messages, users, P2P market, leaderboard, theme, and admin tools.' }

        function startOnboarding() {
            const overlay = document.getElementById('onboardingOverlay');
            overlay.innerHTML = '<div class="onboarding-spotlight" id="onboardingSpotlight"></div><div class="onboarding-card"><h4 id="obTitle"></h4><p id="obText"></p><div class="ob-actions"><button class="btn" onclick="skipOnboarding()">Skip</button><button class="btn btn-accent" onclick="nextOnboarding()">Next</button></div></div>';
            overlay.classList.add('show');
            onboardingStep = 0;
            positionOnboarding();
        }
        function positionOnboarding() {
            const step = onboardingSteps[onboardingStep];
            const target = document.querySelector(step.sel);
            if (!target) return;
            target.scrollIntoView({ behavior:'smooth', block:'center' });
            const rect = target.getBoundingClientRect();
            const spotlight = document.getElementById('onboardingSpotlight');
            spotlight.style.top = rect.top + 'px'; spotlight.style.left = rect.left + 'px'; spotlight.style.width = rect.width + 'px'; spotlight.style.height = rect.height + 'px';
            const card = document.querySelector('.onboarding-card');
            card.style.position = 'absolute';
            const targetBottom = rect.bottom; const cardHeight = card.offsetHeight; const cardWidth = card.offsetWidth;
            let top = targetBottom + 12; if (top + cardHeight > window.innerHeight) top = rect.top - cardHeight - 12; if (top < 8) top = 8;
            let left = Math.max(8, Math.min(rect.left, window.innerWidth - cardWidth - 8));
            card.style.top = top + 'px'; card.style.left = left + 'px';
            document.getElementById('obTitle').textContent = step.title;
            document.getElementById('obText').textContent = step.text;
            document.querySelector('.onboarding-card .btn-accent').textContent = onboardingStep === onboardingSteps.length - 1 ? 'Finish' : 'Next';
        }
        window.nextOnboarding = function() {
            if (onboardingStep < onboardingSteps.length - 1) { onboardingStep++; positionOnboarding(); }

        window.openAdminPanel = function() {
            openModal(`<div class="modal-overlay" onclick="if(event.target===this){event.stopPropagation();closeModal();}"><div class="modal-box" style="max-width:400px;"><div class="modal-header"><h3>🛡️ Admin Panel</h3><button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button></div><div class="modal-body">
                <button class="btn btn-sm" onclick="loadAdminReports()">Open Reports</button>

        window.loadAdminReports = function() {

                const reports = snap.val() || {};

            logModeration('remove', type, targetId);

        window.resolveReport = function(type, targetId, reportId) {
            db.ref(`reports/${type}/${targetId}/${reportId}`).update({status:'resolved', resolvedBy:userId, resolvedAt:firebase.database.ServerValue.TIMESTAMP});

        window.loadAdminUsers = function() {

        window.searchAdminUsers = function() {
            const q = (document.getElementById('adminUserSearch')?.value||'').toLowerCase();
            db.ref('users').once('value').then(snap=>{
                const users = snap.val() || {};

        window.navigateToSource = function(sourceType, sourceId) { closeAllPopovers(); if (sourceType === 'poll' || sourceType === 'post') viewPoll(sourceId); else if (sourceType === 'comment') { const poll = allPolls.find(p => p.id === sourceId || p.shortId === sourceId); if (poll) { pendingCommentId = sourceId; viewPoll(poll.shortId || poll.id); openComments[poll.id] = true; setTimeout(() => { const commentEl = document.getElementById('comment-'+sourceId); if (commentEl) commentEl.scrollIntoView({ behavior:'smooth', block:'center' }); }, 300); } } else if (sourceType === 'chat') showTradeDetailByEscrow(sourceId); else if (sourceType === 'tip') { if (sourceId) viewPublicProfile(sourceId); } };

        let initialMessagesLoaded = false;
        const messagesRef = db.ref('users/' + userId + '/messages');
        messagesRef.once('value').then(snap => {
            const msgs = snap.val() || {}; let unreadCount = 0;
            Object.values(msgs).forEach(msg => { if (!msg.read) unreadCount++; });
            pwrCache.unreadMessages = unreadCount; userRef.child('unreadMessages').set(unreadCount); updateNotificationDot();
            initialMessagesLoaded = true;
            messagesRef.on('child_added', snap => { if (!initialMessagesLoaded) return; const msg = snap.val(); if (msg && !msg.read) { toast(`💬 ${msg.fromName || 'Someone'} sent you ${msg.amount ? fmtPwrExact(msg.amount)+' PWR' : 'a message'}`); userRef.child('unreadMessages').transaction(c => (c||0)+1).then(()=>{ pwrCache.unreadMessages = (pwrCache.unreadMessages||0)+1; updateNotificationDot(); }); } });
        });

        window.openMessages = function(){ const popover = document.getElementById('messagesPopover'); popover.style.top = morePopoverPosition.top; popover.style.left = morePopoverPosition.left; popover.style.transform = morePopoverPosition.transform; popover.style.right = 'auto'; popover.classList.add('show'); messagesPopoverVisible = true; closePwrPopover(); closeUserSearch(); closeP2PMarket(); renderMessages(); };
        window.closeMessages = function(){ document.getElementById('messagesPopover').classList.remove('show'); messagesPopoverVisible = false; };
        function renderMessages(){ const container = document.getElementById('messagesList'); db.ref('users/' + userId + '/messages').once('value').then(snap => { const msgs = snap.val() || {}; const arr = Object.keys(msgs).map(key => ({ key, ...msgs[key] })).filter(m => !m.deleted); arr.sort((a,b)=>(b.time||0)-(a.time||0)); if(arr.length === 0){ container.innerHTML = '<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">No messages yet.</div>'; return; } container.innerHTML = arr.map(m => { const unreadClass = m.read ? '' : ' unread'; const isMention = m.text && m.text.includes('mentioned you') && m.sourceType; let messageContent = ''; if (isMention) { const fromNameEsc = esc(m.fromName||'User'); const usernameClick = `<span class="clickable-mention" onclick="event.stopPropagation();lookupAndViewProfile('${m.from}')">@${fromNameEsc}</span>`; const sourceTag = `<span class="source-type-link" data-type="${esc(m.sourceType)}" data-id="${esc(m.sourceId)}">${esc(m.sourceType)}</span>`; const quote = m.sourceTitle ? `: "${esc(m.sourceTitle)}"` : ''; messageContent = `<div class="text-content-box"><div class="text-content">${usernameClick} mentioned you in a ${sourceTag}${quote}</div></div>`; } else if (m.text) { messageContent = `<div class="text-content-box"><div class="text-content">${linkify(m.text)}</div></div>`; } return `<div class="msg-card${unreadClass}"><div class="user-avatar" style="${getUserAvatar(m.from||'')}" onclick="event.stopPropagation();lookupAndViewProfile('${m.from}')">${getInitials(m.fromName||'?')}</div><div style="flex:1;min-width:0;"><div style="display:flex;justify-content:space-between;align-items:center;"><span class="clickable-mention" style="font-size:0.62rem;" onclick="event.stopPropagation();lookupAndViewProfile('${m.from}')">${esc(m.fromName||'User')}</span><span style="font-size:0.5rem;color:var(--text-muted);">${safeTs(m.time)}</span></div>${m.amount ? `<div style="font-size:0.6rem;color:var(--green);font-weight:600;">+${fmtPwrExact(m.amount)} PWR</div>` : ''}${messageContent}<div style="display:flex;justify-content:flex-end;margin-top:4px;"><button class="delete-btn" title="Delete message" onclick="event.stopPropagation();deleteMessage('${m.key}')">✕</button></div></div></div>`; }).join(''); Object.keys(msgs).forEach(key => { if (!msgs[key].read && !msgs[key].deleted) db.ref('users/' + userId + '/messages/' + key).update({ read: true }); }); userRef.child('unreadMessages').set(0); pwrCache.unreadMessages = 0; updateNotificationDot(); }); }

        window.toggleUserSearch = function(){ const popover = document.getElementById('userSearchPopover'); popover.style.top = morePopoverPosition.top; popover.style.left = morePopoverPosition.left; popover.style.transform = morePopoverPosition.transform; popover.style.right = 'auto'; popover.classList.toggle('show'); userSearchVisible = popover.classList.contains('show'); if(userSearchVisible){ document.getElementById('userSearchInputPopover').value=''; document.getElementById('userSearchInputPopover').focus(); searchUsers(); closePwrPopover(); closeP2PMarket(); closeMessages(); } };

        window.searchUsers = function(){ const q = document.getElementById('userSearchInputPopover').value.trim().toLowerCase(); const container = document.getElementById('userSearchResults'); if(!q){ container.innerHTML='<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">Type to search...</div>'; return; } db.ref('users').once('value').then(snap => { const users = snap.val() || {}; const results = []; Object.entries(users).forEach(([uid, d]) => { const uname = (d.username || '').toLowerCase(); if(uname.includes(q) || uid.toLowerCase().includes(q) || (d.publicId||'').toLowerCase().includes(q)) results.push({ uid, username: d.username || '', balance: d.pwrBalance || 0, showBalance: d.showBalance !== false }); }); container.innerHTML = results.length ? results.map(r => `<div class="user-list-item" onclick="viewPublicProfile('${r.uid}')"><div class="user-avatar" style="${getUserAvatar(r.uid)}">${getInitials(r.username||r.uid)}</div><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:0.7rem;">${esc(r.username||'Anonymous')}</div><div style="font-size:0.55rem;color:var(--text-muted);" title="${r.showBalance ? fmtPwrPlain(r.balance)+' PWR' : 'Hidden'}">${r.showBalance ? fmtBalance(r.balance)+' PWR' : 'Balance hidden'}</div></div><button class="btn btn-sm" onclick="event.stopPropagation();openTipModal('${r.uid}','${esc(r.username||'User')}')">💸 Tip</button></div>`).join('') : '<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">No users found.</div>'; }); };

        function loadP2PListings(){ const container = document.getElementById('p2pListings'); container.innerHTML = '<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">Loading...</div>'; if(p2pActiveTab === 'buy' || p2pActiveTab === 'sell'){ db.ref('p2pListings').once('value').then(snap => { const listings = snap.val() || {}; const arr = []; const now = Date.now(); Object.entries(listings).forEach(([lid, l]) => { if(l && l.type === p2pActiveTab && l.active !== false && (!l.expiresAt || l.expiresAt > now)) arr.push({ lid, ...l }); }); arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); if(arr.length === 0){ container.innerHTML = '<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">No listings found.</div>'; return; } const sellerIds = [...new Set(arr.map(l=>l.sellerId))]; Promise.all(sellerIds.map(sid=>db.ref('users/'+sid).once('value'))).then(userSnaps => { const userMap = {}; userSnaps.forEach((snap,i)=>{ userMap[sellerIds[i]] = snap.val() || {}; }); container.innerHTML = arr.map(l => { const seller = userMap[l.sellerId] || {}; const sellerName = getDisplayName({...seller, uid: l.sellerId}); const isOwn = l.sellerId === userId; const completedTrades = (seller.history||[]).filter(h=>h.method==='Escrow Release'||h.method==='Received from trade'||h.method==='Escrow Release (Sold)'||h.method==='Escrow Release (Bought)').length; const actionBtn = isOwn ? `<button class="btn btn-red btn-sm" style="margin-top:6px;" onclick="cancelListing('${l.lid}')">Cancel</button>` : `<button class="btn btn-accent btn-sm" style="margin-top:6px;" onclick="showTradeDetail('${l.lid}')">Trade</button>`; return `<div class="listing-card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div class="user-avatar" style="${getUserAvatar(l.sellerId)}" onclick="event.stopPropagation();viewPublicProfile('${l.sellerId}')">${getInitials(sellerName)}</div><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:0.75rem;">${esc(sellerName)} ${isOwn ? '<span style="color:var(--accent);font-size:0.6rem;">(Yours)</span>' : ''}</div><div style="font-size:0.6rem;color:var(--text-muted);">${completedTrades} trades · ${safeTs(l.createdAt)}</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-weight:700;font-size:0.8rem;">${fmtPwrExact(l.pwrAmount)} PWR</span><span style="font-size:0.75rem;color:var(--gold);">${l.usdtPrice} USDT/PWR</span></div><div style="font-size:0.6rem;color:var(--text-muted);">Expires: ${l.expiresAt ? formatAbsolute(l.expiresAt) : 'N/A'}</div>${l.usdtNetwork ? `<div style="font-size:0.6rem;color:var(--text-muted);">Network: ${l.usdtNetwork}</div>` : ''}${actionBtn}</div>`; }).join(''); }); }); } else { db.ref('escrows').once('value').then(snap => { const allEscrows = snap.val() || {}; const trades = []; Object.entries(allEscrows).forEach(([eid, e]) => { if(e.buyerId === userId || e.sellerId === userId) trades.push({ eid, ...e, role: e.buyerId===userId?'buyer':'seller' }); }); trades.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); container.innerHTML = trades.length ? trades.map(t => { const stateColors = { awaiting_payment:'var(--amber)', payment_claimed:'#3b82f6', completed:'var(--green)', disputed:'var(--red)', cancelled:'var(--text-muted)' }; const otherPartyId = t.role==='buyer'?t.sellerId:t.buyerId; const otherPartyName = t.role==='buyer'?t.sellerUsername:t.buyerUsername; return `<div class="escrow-row" onclick="showTradeDetailByEscrow('${t.eid}')"><div style="display:flex;align-items:center;gap:8px;"><div class="user-avatar" style="${getUserAvatar(otherPartyId)}" onclick="event.stopPropagation();viewPublicProfile('${otherPartyId}')">${getInitials(otherPartyName||'?')}</div><div><div style="font-weight:600;font-size:0.7rem;">${fmtPwrExact(t.pwrAmount)} PWR</div><div style="font-size:0.55rem;color:var(--text-muted);">${t.role==='buyer'?'Bought from':'Sold to'} ${esc(otherPartyName||'...')} · ${safeTs(t.createdAt)}</div></div></div><div style="text-align:right;"><span class="badge" style="background:${stateColors[t.state]||'var(--bg-secondary)'};color:#fff;font-size:0.55rem;">${t.state}</span></div></div>`; }).join('') : '<div style="font-size:0.65rem;color:var(--text-muted);text-align:center;padding:10px;">No trades yet.</div>'; }); } }

        window.showTradeDetail = function(lid){ db.ref('p2pListings/'+lid).once('value').then(snap => { const l = snap.val(); if(!l || !l.active) { toast('Listing no longer available.'); return; } db.ref('users/'+l.sellerId).once('value').then(snap2 => { const seller = snap2.val() || {}; const sellerName = getDisplayName({...seller, uid: l.sellerId}); openModal(`<div class="modal-overlay" onclick="if(event.target===this){event.stopPropagation();closeModal();}"><div class="modal-box"><div class="modal-header"><h3>📦 Trade Details</h3><button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button></div><div class="modal-body"><div class="profile-row" style="cursor:pointer;" onclick="viewPublicProfile('${l.sellerId}')"><strong>Seller:</strong> ${esc(sellerName)}</div><div class="profile-row"><strong>PWR Amount:</strong> ${fmtPwrExact(l.pwrAmount)} PWR</div><div class="profile-row"><strong>Price:</strong> ${l.usdtPrice} USDT/PWR</div><div class="profile-row"><strong>Total:</strong> ${(l.pwrAmount*l.usdtPrice).toFixed(2)} USDT</div><div class="profile-row"><strong>USDT Address:</strong><br><span style="font-family:'JetBrains Mono',monospace;word-break:break-all;font-size:0.7rem;">${esc(l.usdtAddress||'Not provided')}</span> <button class="btn btn-sm" onclick="copyText('${esc(l.usdtAddress||'')}')"><i class="fa-solid fa-copy"></i></button></div>${l.usdtNetwork ? `<div class="profile-row"><strong>Network:</strong> ${l.usdtNetwork}</div>` : ''}<button class="btn btn-accent btn-sm" onclick="closeModal();acceptTrade('${lid}')" style="margin-top:12px;">Accept & Pay</button></div></div></div>`); }); }); };

        window.showTradeDetailByEscrow = function(eid){ db.ref('escrows/'+eid).once('value').then(snap => { const e = snap.val(); if(!e) return; const isBuyer = e.buyerId === userId; const isSeller = e.sellerId === userId; const stateColors = { awaiting_payment:'var(--amber)', payment_claimed:'#3b82f6', completed:'var(--green)', disputed:'var(--red)', cancelled:'var(--text-muted)' }; let actions = ''; if (e.state === 'awaiting_payment' && isBuyer) actions += `<button class="btn btn-accent btn-sm" onclick="markPaymentSent('${eid}')">I have paid</button> `; if (e.state === 'payment_claimed' && isSeller) actions += `<button class="btn btn-green btn-sm" onclick="window.confirmAction('Confirm Payment','Release PWR to buyer?',()=>confirmPaymentReceived('${eid}'))">Confirm Payment</button> `; if (e.state === 'awaiting_payment' && isSeller) actions += `<button class="btn btn-red btn-sm" onclick="cancelEscrowTrade('${eid}')">Cancel Trade</button> `; if (e.state === 'payment_claimed' && isBuyer) actions += `<button class="btn btn-red btn-sm" onclick="disputeEscrow('${eid}')">Dispute</button> `; const chatHtml = `<div style="margin-top:12px;"><label>Chat</label><div id="escrowChat-${eid}" style="max-height:120px;overflow-y:auto;border:1px solid var(--border-subtle);border-radius:6px;padding:6px;margin-bottom:6px;font-size:0.6rem;">Loading...</div><div style="display:flex;gap:4px;align-items:center;"><textarea class="form-input" id="escrowChatInput-${eid}" placeholder="Type..." style="font-size:0.6rem;padding:4px 8px;flex:1;resize:none;min-height:auto;"></textarea><label class="btn btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-paperclip"></i><input type="file" accept="image/*,video/*" onchange="handleEscrowMedia('${eid}', this)" style="display:none;"></label><button class="btn btn-sm" onclick="sendEscrowMessage('${eid}')">Send</button></div></div>`; openModal(`<div class="modal-overlay" onclick="if(event.target===this){event.stopPropagation();closeModal();}"><div class="modal-box"><div class="modal-header"><h3>📦 Trade</h3><button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button></div><div class="modal-body"><div class="profile-row"><strong>Status:</strong> <span class="badge" style="background:${stateColors[e.state]||'var(--bg-secondary)'};color:#fff;">${e.state}</span></div><div class="profile-row"><strong>PWR Amount:</strong> ${fmtPwrExact(e.pwrAmount)} PWR</div><div class="profile-row"><strong>Price:</strong> ${e.usdtPrice} USDT/PWR</div><div class="profile-row" style="cursor:pointer;" onclick="viewPublicProfile('${e.sellerId}')"><strong>Seller:</strong> ${esc(e.sellerUsername||'User')}</div><div class="profile-row" style="cursor:pointer;" onclick="viewPublicProfile('${e.buyerId}')"><strong>Buyer:</strong> ${esc(e.buyerUsername||'User')}</div><div class="profile-row"><strong>USDT Address:</strong><br><span style="font-family:'JetBrains Mono',monospace;word-break:break-all;font-size:0.7rem;">${esc(e.usdtAddress||'Not provided')}</span> <button class="btn btn-sm" onclick="copyText('${esc(e.usdtAddress||'')}')"><i class="fa-solid fa-copy"></i></button></div>${e.usdtNetwork ? `<div class="profile-row"><strong>Network:</strong> ${e.usdtNetwork}</div>` : ''}${actions ? `<div style="display:flex;gap:6px;margin:12px 0;">${actions}</div>` : ''}${chatHtml}</div></div></div>`); setTimeout(()=> loadEscrowChat(eid), 200); }); };

        function loadEscrowChat(eid) { const chatDiv = document.getElementById('escrowChat-'+eid); if(!chatDiv) return; db.ref('escrows/'+eid+'/messages').off(); db.ref('escrows/'+eid+'/messages').on('value', snap => { const msgs = snap.val() || {}; const arr = Object.keys(msgs).map(k=>({...msgs[k]})); arr.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)); chatDiv.innerHTML = arr.map(m => { let textPart = ''; let mediaPart = ''; if (m.text) textPart = `<div class="text-content-box"><div class="text-content">${linkify(m.text)}</div></div>`; if (m.mediaUrl) { const isVideo = m.mediaUrl.startsWith('data:video') || /\.(mp4|webm|mov)/i.test(m.mediaUrl); if (isVideo) mediaPart = `<div class="chat-media-box"><video src="${esc(m.mediaUrl)}" controls style="max-width:120px;max-height:80px;border-radius:4px;cursor:pointer;" onclick="event.stopPropagation();openMediaViewer('${esc(m.mediaUrl)}','video')"></video></div>`; else mediaPart = `<div class="chat-media-box"><img src="${esc(m.mediaUrl)}" style="max-width:120px;max-height:80px;border-radius:4px;cursor:pointer;margin-top:2px;" onclick="event.stopPropagation();openMediaViewer('${esc(m.mediaUrl)}','image')"></div>`; } return `<div style="margin:2px 0;"><strong style="font-size:0.55rem;">${esc(m.senderName||'?')}:</strong> ${textPart}${mediaPart} <span style="font-size:0.45rem;color:var(--text-muted);">${safeTs(m.timestamp)}</span></div>`; }).join('') || '<span style="font-size:0.55rem;">No messages</span>'; }); }
        window.sendEscrowMessage = function(eid){ const input = document.getElementById('escrowChatInput-'+eid); const text = input.value.trim(); const mediaUrl = window._escrowMediaToSend; if(!text && !mediaUrl) return; const msg = { senderId: userId, senderName: pwrCache.username||'You', timestamp: firebase.database.ServerValue.TIMESTAMP }; if (text) msg.text = text; if (mediaUrl) msg.mediaUrl = mediaUrl; db.ref('escrows/'+eid+'/messages').push(msg); input.value=''; if (mediaUrl) { window._escrowMediaToSend=null; const fileInput = document.querySelector(`#escrowChatInput-${eid}`).parentElement.querySelector('input[type="file"]'); if(fileInput) fileInput.value=''; } if (text) processMentions(text, 'chat', eid, 'Trade chat'); };
        window.handleEscrowMedia = async function(eid, input) { const file=input.files[0]; if(!file)return; if(file.size > MAX_FILE_SIZE_MB*1024*1024){toast('File too large.');return;} if(file.type.startsWith('image/')){const dataUrl=await resizeImageIfImage(file); window._escrowMediaToSend=dataUrl;} else if(file.type.startsWith('video/')){const reader=new FileReader();reader.onload=e=>{window._escrowMediaToSend=e.target.result;};reader.readAsDataURL(file);} else {toast('Unsupported file type.');return;} toast('Media attached. Send your message.'); };
        window.markPaymentSent=function(eid){db.ref('escrows/'+eid).update({state:'payment_claimed'});toast('Payment marked as sent.');closeModal();};
        window.confirmPaymentReceived=function(eid){db.ref('escrows/'+eid).once('value').then(snap=>{const e=snap.val();if(!e||e.state!=='payment_claimed')return;db.ref('escrows/'+eid).update({state:'completed',completedAt:firebase.database.ServerValue.TIMESTAMP});db.ref('users/'+e.buyerId).child('pwrBalance').transaction(c=>(c||1000)+e.pwrAmount).then(()=>{db.ref('users/'+e.buyerId).child('history').once('value').then(hSnap=>{const h=hSnap.val()||[];h.push({amount:e.pwrAmount,time:Date.now(),method:'Escrow Release (Bought)',msg:'P2P trade completed',cp:e.sellerUsername||'',txid:'tx_'+shortId()});db.ref('users/'+e.buyerId).child('history').set(h.slice(-500));});});db.ref('users/'+e.sellerId).child('history').once('value').then(hSnap=>{const h=hSnap.val()||[];h.push({amount:0,time:Date.now(),method:'Escrow Release (Sold)',msg:'P2P trade completed',cp:e.buyerUsername||'',txid:'tx_'+shortId()});db.ref('users/'+e.sellerId).child('history').set(h.slice(-500));});toast('Trade completed!');closeModal();loadP2PListings();});};
        window.cancelEscrowTrade=function(eid){db.ref('escrows/'+eid).once('value').then(snap=>{const e=snap.val();if(!e||e.state!=='awaiting_payment')return;db.ref('escrows/'+eid).update({state:'cancelled'});db.ref('users/'+e.sellerId).child('pwrBalance').transaction(c=>(c||1000)+e.pwrAmount).then(()=>{db.ref('users/'+e.sellerId).child('history').once('value').then(hSnap=>{const h=hSnap.val()||[];h.push({amount:e.pwrAmount,time:Date.now(),method:'Refund',msg:'Escrow cancelled',cp:e.buyerUsername||'',txid:'tx_'+shortId()});db.ref('users/'+e.sellerId).child('history').set(h.slice(-500));});});toast('Trade cancelled and PWR refunded.');closeModal();loadP2PListings();});};

        window.openCreateListing=function(){const expDate=new Date(Date.now()+86400000*2);const defaultNetwork=pwrCache.usdtNetwork||'BEP-20';openModal(`<div class="modal-overlay" onclick="if(event.target===this){event.stopPropagation();closeModal();}"><div class="modal-box"><div class="modal-header"><h3>📝 Create P2P Listing</h3><button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button></div><div class="modal-body"><div class="form-group"><label>Listing Type</label><div style="display:flex;gap:6px;"><button class="exp-chip active" id="listTypeSell" onclick="document.getElementById('listTypeBuy').classList.remove('active');this.classList.add('active');">Sell PWR</button><button class="exp-chip" id="listTypeBuy" onclick="document.getElementById('listTypeSell').classList.remove('active');this.classList.add('active');">Buy PWR</button></div></div><div class="form-group"><label>PWR Amount</label><input class="form-input" type="number" id="listPwrAmount" min="0.0001" step="0.0001" value="10"></div><div class="form-group"><label>Price (USDT per PWR)</label><input class="form-input" type="number" id="listUsdtPrice" min="0.01" step="0.01" value="1"></div><div class="form-group"><label>USDT Address</label><input class="form-input" id="listUsdtAddress" value="${esc(pwrCache.usdtAddress||'')}" placeholder="0x... (visible to buyer after trade)"></div><div class="form-group"><label>Network</label><div style="display:flex;gap:6px;" id="networkChips"><button class="exp-chip ${defaultNetwork==='BEP-20'?'active':''}" onclick="document.getElementById('listUsdtNetwork').value='BEP-20';document.querySelectorAll('#networkChips .exp-chip').forEach(c=>c.classList.remove('active'));this.classList.add('active');">BEP-20</button><button class="exp-chip ${defaultNetwork==='TRC-20'?'active':''}" onclick="document.getElementById('listUsdtNetwork').value='TRC-20';document.querySelectorAll('#networkChips .exp-chip').forEach(c=>c.classList.remove('active'));this.classList.add('active');">TRC-20</button></div><input type="hidden" id="listUsdtNetwork" value="${defaultNetwork}"></div><div class="form-group"><label>Expiration</label><input class="form-input" type="datetime-local" id="listExp" value="${new Date(expDate.getTime()-expDate.getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><button class="btn btn-green btn-sm" id="createListingBtn" onclick="createP2PListing()" style="width:auto;margin-top:8px;">📝 Create Listing</button></div></div></div>`);};
        window.createP2PListing=function(){const btn=document.getElementById('createListingBtn');if(!btn)return;btn.disabled=true;btn.textContent='⏳...';const type=document.getElementById('listTypeBuy').classList.contains('active')?'buy':'sell';const pwrAmount=parseFloat(document.getElementById('listPwrAmount').value)||0;const usdtPrice=parseFloat(document.getElementById('listUsdtPrice').value)||0;const usdtAddress=document.getElementById('listUsdtAddress').value.trim();const usdtNetwork=document.getElementById('listUsdtNetwork').value;const expVal=document.getElementById('listExp').value;const expiresAt=expVal?new Date(expVal).getTime():Date.now()+172800000;if(pwrAmount<=0||usdtPrice<=0){toast('Enter valid amounts.');btn.disabled=false;btn.textContent='📝 Create Listing';return;}if(type==='sell'&&pwrCache.balance<pwrAmount){toast('Insufficient PWR balance.');btn.disabled=false;btn.textContent='📝 Create Listing';return;}const listingData={type,pwrAmount,usdtPrice,usdtAddress,usdtNetwork,sellerId:userId,sellerUsername:pwrCache.username||'',active:true,createdAt:firebase.database.ServerValue.TIMESTAMP,expiresAt};const writeOp=db.ref('p2pListings').push(listingData);if(type==='sell'){deductPwr(pwrAmount,'Escrow Lock (Sell Listing)','P2P Sell Listing','').then(ok=>{if(!ok){toast('PWR deduction failed.');btn.disabled=false;btn.textContent='📝 Create Listing';return;}writeOp.then(()=>{closeModal();p2pActiveTab=type;loadP2PListings();toast('Listing created! PWR locked.');}).catch(()=>{toast('Failed to save listing.');btn.disabled=false;btn.textContent='📝 Create Listing';});});}else{writeOp.then(()=>{closeModal();p2pActiveTab=type;loadP2PListings();toast('Listing created!');}).catch(()=>{toast('Failed to save listing.');btn.disabled=false;btn.textContent='📝 Create Listing';});}};
        window.acceptTrade=function(lid){db.ref('p2pListings/'+lid).once('value').then(snap=>{const l=snap.val();if(!l||!l.active){toast('Listing no longer available.');return;}if(l.sellerId===userId){toast('Cannot trade with yourself.');return;}if(l.type==='sell'){const escrowData={pwrAmount:l.pwrAmount,usdtPrice:l.usdtPrice,usdtAddress:l.usdtAddress||'',usdtNetwork:l.usdtNetwork,sellerId:l.sellerId,sellerUsername:l.sellerUsername,buyerId:userId,buyerUsername:pwrCache.username||'',counterpartyName:l.sellerUsername||'User',state:'awaiting_payment',createdAt:firebase.database.ServerValue.TIMESTAMP};db.ref('p2pListings/'+lid).update({active:false});db.ref('escrows').push(escrowData).then(()=>{toast('Trade accepted. Pay USDT and mark as paid.');loadP2PListings();});}else{const acceptorUsdtAddress=prompt('Enter your USDT address to receive payment:')||pwrCache.usdtAddress||'';if(!acceptorUsdtAddress){toast('USDT address required.');return;}const acceptorNetwork=pwrCache.usdtNetwork||'BEP-20';deductPwr(l.pwrAmount,'Escrow Lock (Buy Order)','P2P Buy Order Escrow',l.sellerUsername).then(ok=>{if(!ok){toast('PWR deduction failed.');return;}const escrowData={pwrAmount:l.pwrAmount,usdtPrice:l.usdtPrice,usdtAddress:acceptorUsdtAddress,usdtNetwork:acceptorNetwork,sellerId:userId,sellerUsername:pwrCache.username||'',buyerId:l.sellerId,buyerUsername:l.sellerUsername,counterpartyName:l.sellerUsername||'User',state:'awaiting_payment',createdAt:firebase.database.ServerValue.TIMESTAMP,originalListId:lid};db.ref('p2pListings/'+lid).update({active:false});db.ref('escrows').push(escrowData).then(ref=>{const escrowId=ref.key;const msg={from:userId,fromName:pwrCache.username||'User',text:`Accepted your buy order. Please send USDT to ${acceptorUsdtAddress} (${acceptorNetwork}).`,time:Date.now(),read:false,sourceType:'chat',sourceId:escrowId};db.ref('users/'+l.sellerId+'/messages').push(msg);db.ref('users/'+l.sellerId+'/unreadMessages').transaction(c=>(c||0)+1);toast('Buy order accepted. PWR         window.openTipModal=function(recipientId,recipientName){if(recipientId===userId){toast('You cannot send PWR to yourself.');return;}tipMediaUrls=[];openModal(`<div class="modal-overlay" onclick="if(event.target===this){event.stopPropagation();closeModal();}"><div class="modal-box"><div class="modal-header"><h3>💸 Send PWR</h3><button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button></div><div class="modal-body"><div style="text-align:center;margin-bottom:12px;"><div class="user-avatar-lg" style="${getUserAvatar(recipientId)};margin:0 auto 6px;">${getInitials(recipientName)}</div><div style="font-weight:700;">${esc(recipientName)}</div></div><div class="form-group"><label>Amount (PWR)</label><input class="form-input" type="number" id="tipAmount" min="0.0001" step="0.0001" value="1"></div><div class="form-group"><label>Message</label><textarea class="form-input" id="tipMessage" rows="2" placeholder="Add a note..."></textarea></div><div class="form-group"><label>Media Attachment (Optional, max ${MAX_FILE_SIZE_MB}MB each)</label><div class="dropzone" id="tipDropzone" onclick="document.getElementById('tipMediaFile').click()"><div class="dz-placeholder"><div class="dz-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div><div class="dz-text">Drag & drop or click to upload<br>Images/Videos (Max ${MAX_FILE_SIZE_MB}MB each) or paste URL</div><div class="paste-row" onclick="event.stopPropagation()"><input type="text" id="tipPasteUrlInput" placeholder="Paste Image/Video URL..."><button class="btn btn-accent btn-sm" onclick="handleTipPasteUrl()">Attach</button></div></div><input type="file" id="tipMediaFile" accept="image/*,video/*" onchange="handleTipMediaSelect(this)" multiple style="position:absolute;left:-9999px;"></div></div><button class="btn btn-accent btn-sm" onclick="window.confirmAction('Confirm Send','Send PWR to ${esc(recipientName)}?',()=>sendTip('${recipientId}','${esc(recipientName).replace(/'/g,"\\'")}'))" style="width:auto;margin-top:8px;">💸 Send PWR</button></div></div></div>`);window.handleTipMediaSelect=async function(input){const files=input.files;if(!files||files.length===0)return;for(const file of files){if(file.size>MAX_FILE_SIZE_MB*1024*1024){toast(`File too large (max ${MAX_FILE_SIZE_MB}MB).`);continue;}try{const dataUrl=await resizeImageIfImage(file);tipMediaUrls.push(dataUrl);}catch(e){toast('Failed to read file.');}}updateTipDropzonePreviewAll();};window.handleTipPasteUrl=function(){const url=document.getElementById('tipPasteUrlInput').value.trim();if(!url)return;tipMediaUrls.push(url);updateTipDropzonePreviewAll();document.getElementById('tipPasteUrlInput').value='';};window.updateTipDropzonePreviewAll=function(){const dz=document.getElementById('tipDropzone');if(!dz)return;let html='';tipMediaUrls.forEach((src,i)=>{const ytId=getYouTubeId(src);let thumb='';if(ytId){thumb=`<iframe src="https://www.youtube.com/embed/${ytId}" style="width:60px;height:40px;border-radius:4px;border:none;pointer-events:none;"></iframe>`;}else if(/\.(mp4|webm|mov)/i.test(src)||src.startsWith('data:video')){thumb=`<video src="${esc(src)}" style="width:60px;height:40px;object-fit:cover;border-radius:4px;pointer-events:none;"></video>`;}else{thumb=`<img src="${esc(src)}" style="width:60px;height:40px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'">`;}html+=`<div class="file-preview-item">${thumb}<span style="font-size:0.6rem;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">File ${i+1}</span><button class="file-remove" onclick="event.stopPropagation();removeTipFileItem(${i})">✕</button></div>`;});dz.innerHTML=`${html}<div style="margin-top:8px;font-size:0.65rem;color:var(--text-muted);cursor:pointer;" onclick="document.getElementById('tipMediaFile').click()">+ Add more files</div><input type="file" id="tipMediaFile" accept="image/*,video/*" onchange="handleTipMediaSelect(this)" multiple style="position:absolute;left:-9999px;">`;dz.onclick=function(e){if(e.target===dz||e.target.classList.contains('dz-placeholder')||e.target.closest('.dz-placeholder')){document.getElementById('tipMediaFile').click();}};};window.removeTipFileItem=function(index){tipMediaUrls.splice(index,1);updateTipDropzonePreviewAll();};};

        function renderComments(poll,isExpired){const cmts=[];if(poll.comments)Object.entries(poll.comments).forEach(([id,d])=>{if(d.status&&d.status!=='active')return;cmts.push({id,...d});});cmts.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));let filteredCmts=cmts.filter(c=>{if(c.visibility==='private'&&c.userId!==userId)return false;if(c.visibility==='post_poll'&&!isExpired&&c.userId!==userId)return false;if(commentSearchQuery.trim()!==''){const q=commentSearchQuery.toLowerCase();return(c.text||'').toLowerCase().includes(q)||(c.userId||'').toLowerCase().includes(q);}return true;});const h=filteredCmts.map(c=>{const lc=Object.keys(c.likes||{}).length,dc=Object.keys(c.dislikes||{}).length;const net=lc-dc;const hasLiked=!!(c.likes||{})[userId];const hasDisliked=!!(c.dislikes||{})[userId];let badge='';if(poll.options&&poll.options.length>0){if(c.bindVote&&c.choice)badge=`<span class="comment-badge voted">Voted: ${esc(c.choice)}</span>`;else badge='<span class="comment-badge sidetalk">Sidetalk</span>';}const reactionBtn=`<button class="reaction-btn ${hasLiked?'liked':(hasDisliked?'disliked':'')}" data-comment="${c.id}" onclick="toggleReaction('${poll.id}','${c.id}')">${hasLiked?'👍':(hasDisliked?'👎':'👍')} ${net>=0?'+':''}${net}</button>`;const mediaHtml=getCommentMediaHtml(c.mediaUrls||c.mediaUrl,'comment-'+poll.id+'-'+c.id);const commentText=c.text?renderTextContent(c.text,'comment-'+poll.id+'-'+c.id,true):'';const deleteBtnHtml=c.userId===userId||poll.creatorId===userId||pwrCache.isAdmin?`<button class="delete-btn" title="Delete" onclick="event.stopPropagation();deleteComment('${poll.id}','${c.id}')">✕</button>`:'';const reportBtnHtml=`<button class="report-btn" title="Report" onclick="event.stopPropagation();openReportModal('comment','${poll.id}','${c.id}')">!</button>`;return `<div class="comment-item" id="comment-${c.id}"><div class="comment-meta"><span class="clickable-mention" style="font-size:0.62rem;" onclick="lookupAndViewProfile('${c.userId}')">${(c.userId||'').slice(0,8)}...</span> ${badge} <span>${safeTs(c.timestamp)}</span><div class="comment-actions">${reactionBtn}${deleteBtnHtml}${reportBtnHtml}</div></div>${commentText}${mediaHtml?mediaHtml:''}</div>`;}).join('');const count=cmts.length;return `<div><button type="button" class="btn btn-sm" style="padding:3px 10px;font-size:0.62rem;gap:3px;" onclick="toggleComments('${poll.id}')">💬 (${fmtNum(count)})</button><div id="comments-${poll.id}" style="display:${openComments[poll.id]?'block':'none'};margin-top:6px;width:100%;"><div style="margin-bottom:6px;"><input class="form-input" style="font-size:0.7rem;padding:4px 8px;" placeholder="Search comments..." value="${esc(commentSearchQuery)}" oninput="updateCommentSearch(this.value,'${poll.id}')"></div><div class="comments-vertical-list">${h||'<div style="font-size:0.68rem;color:var(--text-muted);">No comments found.</div>'}</div></div></div>`;}
        window.updateCommentSearch=function(val,pollId){commentSearchQuery=val;const poll=allPolls.find(p=>p.id===pollId||p.shortId===pollId);if(poll){const el=document.getElementById(`comments-${poll.id}`);if(el){const expired=new Date(poll.expiration)<new Date();const list=el.querySelector('.comments-vertical-list');if(list){const dd=document.createElement('div');dd.innerHTML=renderComments(poll,expired);const nl=dd.querySelector('.comments-vertical-list');if(nl)list.innerHTML=nl.innerHTML;initTextClamping(list);}}}};
        window.toggleComments=function(pollId){openComments[pollId]=!openComments[pollId];const el=document.getElementById('comments-'+pollId);if(el)el.style.display=openComments[pollId]?'block':'none';};
        function renderFieldView(){const feed=document.getElementById('pollFeed');let filtered=allPolls.filter(p=>!p.status||p.status==='active').slice();if(showFavoritesOnly)filtered=filtered.filter(p=>p.favoritedBy?.[userId]);const query=searchQuery.trim().toLowerCase();if(query){filtered=filtered.filter(p=>buildSearchableString(p).includes(query));}else{if(activeFilter==='live')filtered=filtered.filter(p=>new Date(p.expiration)>=new Date());else if(activeFilter==='ended')filtered=filtered.filter(p=>new Date(p.expiration)<new Date());}const durFn=p=>new Date(p.expiration)-new Date(p.createdAt);const commentCount=p=>Object.keys(p.comments||{}).length;const favCountFn=p=>Object.keys(p.favoritedBy||{}).length;if(sortBy==='recent')filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));else if(sortBy==='oldest')filtered.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));else if(sortBy==='mostvoted')filtered.sort((a,b)=>(Object.values(b.counts||{}).reduce((x,y)=>x+y,0))-(Object.values(a.counts||{}).reduce((x,y)=>x+y,0)));else if(sortBy==='mostcommented')filtered.sort((a,b)=>commentCount(b)-commentCount(a));else if(sortBy==='mostfavorite')filtered.sort((a,b)=>favCountFn(b)-favCountFn(a));else if(sortBy==='shortest')filtered.sort((a,b)=>durFn(a)-durFn(b));else if(sortBy==='longest')filtered.sort((a,b)=>durFn(b)-durFn(a));if(filtered.length===0){feed.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.85rem;">No posts or polls found.</div>';return;}setMediaAwareHTML(feed,filtered.map(p=>renderPollCard(p,true)).join(''));}
        function renderFeed(){const feed=document.getElementById('pollFeed');if(loading){feed.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';return;}if(viewMode==='field'){renderFieldView();return;}let filtered=allPolls.filter(p=>!p.status||p.status==='active').slice();if(showFavoritesOnly)filtered=filtered.filter(p=>p.favoritedBy?.[userId]);const query=searchQuery.trim().toLowerCase();if(query){filtered=filtered.filter(p=>buildSearchableString(p).includes(query));}else{if(activeFilter==='live')filtered=filtered.filter(p=>new Date(p.expiration)>=new Date());else if(activeFilter==='ended')filtered=filtered.filter(p=>new Date(p.expiration)<new Date());}const durFn=p=>new Date(p.expiration)-new Date(p.createdAt);const commentCount=p=>Object.keys(p.comments||{}).length;const favCountFn=p=>Object.keys(p.favoritedBy||{}).length;if(sortBy==='recent')filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));else if(sortBy==='oldest')filtered.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));else if(sortBy==='mostvoted')filtered.sort((a,b)=>(Object.values(b.counts||{}).reduce((x,y)=>x+y,0))-(Object.values(a.counts||{}).reduce((x,y)=>x+y,0)));else if(sortBy==='mostcommented')filtered.sort((a,b)=>commentCount(b)-commentCount(a));else if(sortBy==='mostfavorite')filtered.sort((a,b)=>favCountFn(b)-favCountFn(a));else if(sortBy==='shortest')filtered.sort((a,b)=>durFn(a)-durFn(b));else if(sortBy==='longest')filtered.sort((a,b)=>durFn(b)-durFn(a));if(filtered.length===0){feed.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.85rem;">No posts or polls found.</div>';return;}const output=filtered.map(p=>{const total=Object.values(p.counts||{}).reduce((a,b)=>a+b,0);const opts=p.options||[],cols=p.optionColors||[],cnts=p.counts||{};const hasOptions=opts.length>0;const pm=hasOptions?opts.map((o,i)=>({name:o,color:cols[i]||COLORS[i%COLORS.length],pct:total?Math.round((cnts[o]||0)/total*100):0})).sort((a,b)=>b.pct-a.pct):[];const top3=pm.slice(0,3);const cc=Object.keys(p.comments||{}).length;const expired=new Date(p.expiration)<new Date();const isFav=p.favoritedBy?.[userId];const favCount=p.favoritedBy?Object.keys(p.favoritedBy).length:0;const starBtn=renderUnifiedStar(p.id,isFav,favCount);const statusPill=expired?'<span class="badge badge-ended"><span class="dot" style="background:var(--red);"></span> Ended</span>':'<span class="badge badge-live"><span class="dot" style="background:var(--green);"></span> Live</span>';const shareBtnHtml=`<button class="share-btn" data-pollid="${p.shortId||p.id}" title="Share"><i class="fa-solid fa-share-nodes"></i></button>`;const subParts=[safeTs(p.createdAt)];if(hasOptions)subParts.push(`<span class="num-toggle" data-full="${fmtNumFull(total)} votes" data-abbr="${fmtNum(total)} votes" onclick="event.stopPropagation();toggleNumDisplay(this)">${fmtNum(total)} votes</span>`);subParts.push(`${fmtNum(cc)} comments`);const durationIndicator=renderDurationIndicator(p);const titleContent=renderTextContent(p.title,'feed-'+p.id,false);return `<div class="history-item" data-poll-id="${p.id}" onclick="viewPoll('${p.shortId||p.id}')"><div class="hi-main"><div class="hi-top-row">${durationIndicator}<div class="hi-sub">${subParts.join(' · ')}</div></div>${titleContent}<div class="hi-top3">${top3.map(o=>`<span style="color:${o.color};" title="${fmtNumFull(cnts[o.name]||0)} votes"><span class="hi-dot" style="background:${o.color};"></span> ${esc(o.name)} <span class="pct-accent">${o.pct}%</span></span>`).join(' ')}</div></div><div class="hi-right-controls"><div style="display:flex;align-items:center;gap:4px;">${shareBtnHtml}${statusPill}</div><div class="hi-bottom-row">${starBtn}</div></div></div>`;}).join('');setMediaAwareHTML(feed,output);}
        function renderAll(){if(activePollId){document.getElementById('heroSection').style.display='none';document.getElementById('filterBar').style.display='none';document.getElementById('favFilterBtn').style.display='none';}else{document.getElementById('heroSection').style.display='flex';document.getElementById('filterBar').style.display='flex';document.getElementById('favFilterBtn').style.display='';}renderFeed();updateStatsFromPolls(allPolls);updatePwrUI();updateHeroClaimButton();updateBackButton();if(!localStorage.getItem('banner_dismissed')){let mrp=null;for(const p of allPolls){if(!mrp||(p.createdAt||0)>(mrp.createdAt||0))mrp=p;}if(mrp){const bannerContent=document.getElementById('bannerContent');setMediaAwareHTML(bannerContent,renderPollCard(mrp,false));document.getElementById('bannerCard').style.display='block';}else{document.getElementById('bannerCard').style.display='none';}}}
        function updateStatsFromPolls(polls){const liveCount=polls.filter(p=>new Date(p.expiration)>=new Date()).length;document.getElementById('liveCount').textContent=fmtNum(liveCount);document.getElementById('endedCount').textContent=fmtNum(polls.length-liveCount);document.getElementById('totalPollsCount').textContent=fmtNum(polls.length);document.getElementById('totalVotesCount').textContent=fmtNum(polls.reduce((s,p)=>s+Object.values(p.counts||{}).reduce((a,b)=>a+b,0),0));}
        function getPollRenderSignature(poll){const critical={title:poll.title,description:poll.description||'',expiration:poll.expiration,mediaUrls:poll.mediaUrls||poll.mediaUrl||[],options:poll.options||[],optionColors:poll.optionColors||[],counts:poll.counts||{},pwrCost:poll.pwrCost||1,commentVisibility:poll.commentVisibility,voteSetting:poll.voteSetting,commentOnlyUsers:poll.commentOnlyUsers||{},voterChoices:poll.voterChoices||{},comments:getCommentsSignature(poll.comments),creatorId:poll.creatorId,status:poll.status};return JSON.stringify(critical,Object.keys(critical).sort());}
        function getCommentsSignature(comments){if(!comments)return {};const sig={};const ids=Object.keys(comments).sort();ids.forEach(id=>{const c=comments[id];sig[id]={userId:c.userId,text:c.text,mediaUrls:c.mediaUrls,visibility:c.visibility,type:c.type,choice:c.choice,bindVote:c.bindVote,timestamp:c.timestamp,status:c.status};});return sig;}
        function hasCriticalChanges(oldPolls,newPolls){if(oldPolls.length!==newPolls.length)return true;const oldMap=new Map(oldPolls.map(p=>[p.id,p]));const newMap=new Map(newPolls.map(p=>[p.id,p]));if(oldMap.size!==newMap.size)return true;for(const [id,oldPoll] of oldMap){const newPoll=newMap.get(id);if(!newPoll)return true;if(getPollRenderSignature(oldPoll)!==getPollRenderSignature(newPoll))return true;}return false;}
        function updateReactionsAndFavInPlace(polls){polls.forEach(poll=>{const safeId=CSS.escape?CSS.escape(poll.id):poll.id.replace(/["\\]/g,'\\$&');const starBtn=document.querySelector(`.unified-star-btn[data-pollid="${safeId}"]`);if(starBtn){const isFav=poll.favoritedBy?.[userId];starBtn.classList.toggle('inactive',!isFav);const badge=starBtn.parentElement?.querySelector('.fav-count-badge');if(badge){const fc=poll.favoritedBy?Object.keys(poll.favoritedBy).length:0;const fcc=fmtNum(fc);badge.textContent=fcc;badge.setAttribute('data-full',fmtNumFull(fc));badge.setAttribute('data-abbr',fcc);}}const pollReactionBtn=document.querySelector(`.poll-reaction-btn[data-poll="${safeId}"]`);if(pollReactionBtn){const pr=poll.pollReactions||{likes:{},dislikes:{}};const liked=!!pr.likes?.[userId];const disliked=!!pr.dislikes?.[userId];const net=(Object.keys(pr.likes||{}).length)-(Object.keys(pr.dislikes||{}).length);pollReactionBtn.textContent=(liked?'👍':(disliked?'👎':'👍'))+' '+(net>=0?'+':'')+net;pollReactionBtn.classList.toggle('liked',liked);pollReactionBtn.classList.toggle('disliked',disliked);}if(poll.comments){Object.entries(poll.comments).forEach(([cid,comment])=>{const btn=document.querySelector(`.reaction-btn[data-comment="${CSS.escape(cid)}"]`);if(btn){const lc=Object.keys(comment.likes||{}).length;const dc=Object.keys(comment.dislikes||{}).length;const net=lc-dc;const hasLiked=!!comment.likes?.[userId];const hasDisliked=!!comment.dislikes?.[userId];btn.textContent=(hasLiked?'👍':(hasDisliked?'👎':'👍'))+' '+(net>=0?'+':'')+net;btn.classList.toggle('liked',hasLiked);btn.classList.toggle('disliked',hasDisliked);}});}});}
        function updateDetailReactionsAndFav(poll){updateReactionsAndFavInPlace([poll]);updateStatsFromPolls(allPolls);updatePwrUI();updateHeroClaimButton();}
        window.viewPoll=function(id){activePollId=id;updateUrl(id);const poll=allPolls.find(p=>p.shortId===activePollId||p.id===activePollId);if(poll){cachedDetailPoll=poll;const feed=document.getElementById('pollFeed');setMediaAwareHTML(feed,renderPollCard(poll,true));}updateBackButton();document.getElementById('heroSection').style.display='none';document.getElementById('filterBar').style.display='none';document.getElementById('favFilterBtn').style.display='none';};
        window.goHome=function(){activePollId=null;cachedDetailPoll=null;clearUrl();document.getElementById('heroSection').style.display='flex';document.getElementById('filterBar').style.display='flex';document.getElementById('favFilterBtn').style.display='';renderAll();updateBackButton();};
        window.dismissBanner=function(){document.getElementById('bannerCard').style.display='none';localStorage.setItem('banner_dismissed','1');};
        function updateUrl(id){history.replaceState({},'',`?p=${id}`);}
        function clearUrl(){history.replaceState({},'',location.pathname);}
        function applyFilter(){renderFeed();}
        document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')renderAll();});
        db.ref('polls').on('value',snap=>{loading=false;const data=snap.val();const newPolls=[];if(data)Object.keys(data).forEach(k=>{const p={id:k,...data[k]};if(!p.status||p.status==='active')newPolls.push(p);});newPolls.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const oldPolls=allPolls.slice();allPolls=newPolls;if(activePollId){const poll=newPolls.find(p=>p.shortId===activePollId||p.id===activePollId);if(poll){if(!cachedDetailPoll||getPollRenderSignature(cachedDetailPoll)!==getPollRenderSignature(poll)){cachedDetailPoll=poll;const feed=document.getElementById('pollFeed');setMediaAwareHTML(feed,renderPollCard(poll,true));}else{updateDetailReactionsAndFav(poll);cachedDetailPoll=poll;}}else{goHome();}}else{if(hasCriticalChanges(oldPolls,newPolls)){renderAll();}else{updateReactionsAndFavInPlace(newPolls);updateStatsFromPolls(newPolls);updatePwrUI();updateHeroClaimButton();updateBackButton();}}});
        const urlUser=new URLSearchParams(location.search).get('u');
        if(urlUser){db.ref('users').once('value').then(snap=>{const users=snap.val()||{};let found=null;Object.entries(users).forEach(([uid,d])=>{if(d.publicId===urlUser||d.username===urlUser||uid===urlUser)found=uid;});if(found)setTimeout(()=>viewPublicProfile(found),600);});}
        const urlPoll=new URLSearchParams(location.search).get('p');
        if(urlPoll){activePollId=urlPoll;}
        updatePwrUI();updateHeroClaimButton();updateBackButton();
        document.getElementById('pollFeed').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    })();
</script>
