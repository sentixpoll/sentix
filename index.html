<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentix</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #060b14;
            --bg-secondary: #0b1221;
            --bg-card: #0f1729;
            --bg-card-hover: #131d33;
            --border-subtle: rgba(255,255,255,0.06);
            --border-medium: rgba(255,255,255,0.10);
            --text-primary: #e8ecf2;
            --text-secondary: #9aa4b8;
            --text-muted: #5f6b80;
            --accent: #38bdf8;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --shadow-card: 0 4px 32px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-size:16px; }
        body {
            font-family:'Inter', system-ui, -apple-system, sans-serif;
            background:var(--bg-primary); color:var(--text-primary);
            min-height:100vh; overflow-x:hidden; line-height:1.5;
            background-image: radial-gradient(ellipse at 30% 15%, rgba(56,189,248,0.04) 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 75%, rgba(16,185,129,0.03) 0%, transparent 60%);
        }
        .grid-bg { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.2;
            background-image:linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                             linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size:40px 40px;
        }
        .orb { position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(80px); opacity:0.1; animation:orbFloat 18s infinite; }
        .orb-1 { width:300px; height:300px; background:#10b981; top:-5%; left:-3%; }
        .orb-2 { width:250px; height:250px; background:#ef4444; bottom:-8%; right:-4%; animation-delay:-6s; }
        .orb-3 { width:200px; height:200px; background:#f59e0b; top:40%; left:60%; animation-delay:-12s; }
        @keyframes orbFloat { 0%,100%{ transform:translate(0,0) scale(1); } 20%{ transform:translate(35px,-25px) scale(1.1); } 40%{ transform:translate(-20px,30px) scale(0.9); } 60%{ transform:translate(28px,18px) scale(1.08); } 80%{ transform:translate(-30px,-20px) scale(0.95); } }
        .app-container { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:18px 16px 50px; }
        .header { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; margin-bottom:18px;
            background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg);
            backdrop-filter:blur(20px); box-shadow:var(--shadow-card); flex-wrap:wrap; gap:10px;
        }
        .logo-area { display:flex; align-items:center; gap:10px; cursor:pointer; }
        .logo-icon { width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,#1a2332,#0f1729);
            border:1px solid var(--border-medium); display:flex; align-items:center; justify-content:center;
            font-size:1.1rem; color:var(--accent);
        }
        .logo-text { font-weight:800; font-size:1.2rem; letter-spacing:-0.4px;
            background:linear-gradient(135deg,#e8ecf2,#bcc5d6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .logo-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981; margin-left:2px; animation:dotPulse 2s infinite; }
        @keyframes dotPulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(1.8); } }
        .header-stats { display:flex; gap:18px; font-size:0.75rem; color:var(--text-secondary); font-family:'JetBrains Mono',monospace; }
        .stat-item { display:flex; align-items:center; gap:5px; cursor:pointer; padding:4px 10px; border-radius:14px; transition:0.2s; }
        .stat-item:hover { background:rgba(255,255,255,0.04); }
        .stat-item .val { font-weight:700; color:var(--text-primary); }
        .btn-icon { background:var(--bg-secondary); border:1px solid var(--border-medium); color:var(--text-primary);
            padding:7px 14px; border-radius:20px; cursor:pointer; font-size:0.8rem; font-weight:500; display:flex; align-items:center; gap:6px; white-space:nowrap;
        }
        .btn-primary { background:linear-gradient(135deg,#1e3a5f,#1a3355); border:1px solid rgba(56,189,248,0.3); color:#e0f0ff; }
        .welcome-card { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:40px 24px; text-align:center; box-shadow:var(--shadow-card); margin-bottom:20px; }
        .btn-explore { background:linear-gradient(135deg,#10b981,#059669); color:#fff; padding:12px 24px; border-radius:24px; font-weight:700; border:none; cursor:pointer; }
        .poll-card { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:24px 22px; margin-bottom:18px; }
        .poll-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; font-size:0.75rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
        .badge { padding:4px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; text-transform:uppercase; }
        .badge-live { background:rgba(239,68,68,0.2); color:#ef4444; }
        .badge-ended { background:rgba(107,114,128,0.15); color:#6b7280; }
        .vote-btn {
            padding: 12px 10px; border-radius: 14px; font-weight: 600; cursor: pointer;
            border: 1.5px solid; text-align: center; flex: 1; min-width: 100px;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,0.02); letter-spacing: 0.2px;
        }
        .vote-btn:hover { filter: brightness(1.2); }
        .option-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; opacity: 0.9; box-shadow: 0 0 6px currentColor; }
        .results-area { margin-top: 12px; }
        .result-row { display: flex; align-items: center; margin-bottom: 10px; gap: 12px; font-size: 0.85rem; }
        .result-label { min-width: 100px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .result-bar-bg { flex: 1; height: 14px; background: rgba(255,255,255,0.03); border-radius: 7px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
        .result-bar-fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--fill-color), var(--fill-color-dark)); transition: width 0.5s ease; }
        .result-percent { font-weight: 700; min-width: 35px; text-align: right; }
        .history-section { margin-top:24px; }
        .tab-bar { display:flex; gap:10px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
        .tab { padding:6px 14px; border-radius:16px; font-size:0.8rem; font-weight:600; cursor:pointer; border:1px solid var(--border-medium); color:var(--text-secondary); background:transparent; }
        .tab.active { background:rgba(56,189,248,0.15); border-color:#38bdf8; color:#38bdf8; }
        .sort-search { display:flex; gap:8px; align-items:center; margin-left:auto; }
        .sort-select, .search-input { background:var(--bg-secondary); border:1px solid var(--border-medium); color:var(--text-primary); padding:5px 10px; border-radius:14px; font-size:0.75rem; }
        .history-item { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:12px; padding:14px 16px; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .history-item:hover { background:var(--bg-card-hover); border-color:var(--border-medium); }
        .hi-left { display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
        .hi-title { font-weight:600; font-size:0.9rem; }
        .hi-time { font-size:0.65rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
        .hi-duration-badge { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:700; color:var(--text-secondary); border:1px solid var(--border-subtle); flex-shrink:0; }
        .hi-sentiments { display:flex; gap:8px; align-items:center; font-size:0.68rem; font-weight:600; }
        .sentiment-badge { display:flex; align-items:center; gap:4px; padding:3px 8px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border-subtle); }
        .sentiment-dot { width:7px; height:7px; border-radius:2px; display:inline-block; }
        .create-form { display:none; margin-bottom:18px; }
        .create-card { background:var(--bg-card); border:1px solid var(--border-medium); border-radius:var(--radius-lg); padding:26px 24px 22px; box-shadow:var(--shadow-card); backdrop-filter:blur(20px); position:relative; }
        .create-card h3 { font-weight:700; font-size:1.1rem; margin-bottom:18px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-secondary); margin-bottom:5px; }
        .form-input { width:100%; padding:12px 14px; background:var(--bg-secondary); border:1px solid var(--border-medium); border-radius:var(--radius-sm); color:var(--text-primary); font-size:0.9rem; outline:none; }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,0.1); }
        .options-list { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
        .option-item { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.02); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:8px 14px; }
        .option-color-dot { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
        .option-item input { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:0.9rem; outline:none; }
        .remove-option-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:1.3rem; padding:4px 8px; border-radius:6px; }
        .add-option-btn { display:flex; align-items:center; gap:8px; background:rgba(56,189,248,0.06); border:1px dashed rgba(56,189,248,0.3); color:#38bdf8; padding:10px 16px; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; }
        .btn-publish { background:linear-gradient(135deg,#10b981,#059669); color:#fff; padding:12px 24px; border-radius:24px; font-weight:700; border:none; cursor:pointer; }
        .btn-cancel-form { background:transparent; border:1px solid var(--border-medium); color:var(--text-secondary); padding:12px 20px; border-radius:24px; font-weight:600; cursor:pointer; }
        /* Signature modal */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-box { background:var(--bg-card); border:1px solid var(--border-medium); border-radius:var(--radius-lg); padding:24px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
        .modal-box h4 { font-weight:700; margin-bottom:12px; }
        .signature-input { width:100%; padding:10px 12px; background:var(--bg-secondary); border:1px solid var(--border-medium); border-radius:var(--radius-sm); color:var(--text-primary); margin-bottom:12px; font-size:0.9rem; }
        .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
        .btn-confirm { background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:none; padding:10px 18px; border-radius:20px; font-weight:600; cursor:pointer; }
        .btn-cancel-modal { background:transparent; border:1px solid var(--border-medium); color:var(--text-secondary); padding:10px 18px; border-radius:20px; cursor:pointer; }
        .visibility-row { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
        .vis-toggle { padding:8px 12px; border-radius:20px; font-size:0.8rem; font-weight:600; border:1px solid var(--border-medium); background:transparent; color:var(--text-secondary); cursor:pointer; transition:0.2s; }
        .vis-toggle.active { border-color:var(--accent); color:#fff; }
        .vis-toggle.public { border-color:#10b981; color:#10b981; }
        .vis-toggle.private { border-color:#ef4444; color:#ef4444; }
        .vis-toggle.postpoll { border-color:#f59e0b; color:#f59e0b; }
        .vis-toggle.public.active { background:#10b981; color:#fff; }
        .vis-toggle.private.active { background:#ef4444; color:#fff; }
        .vis-toggle.postpoll.active { background:#f59e0b; color:#fff; }
        .vmark-toggle { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-secondary); cursor:pointer; }
        .vmark-btn { padding:6px 14px; border-radius:16px; font-weight:600; border:1px solid var(--border-medium); background:transparent; color:var(--text-muted); transition:0.2s; }
        .vmark-btn.active { background:rgba(168,85,247,0.15); border-color:#a855f7; color:#a855f7; }
        .comments-toggle-btn { background:rgba(255,255,255,0.03); border:1px solid var(--border-subtle); color:var(--text-secondary); padding:5px 12px; border-radius:14px; font-size:0.75rem; cursor:pointer; }
        .comments-section { margin-top:16px; border-top:1px solid var(--border-subtle); padding-top:12px; }
        .comment-entry { display:flex; flex-direction:column; gap:6px; padding:10px 12px; background:rgba(255,255,255,0.02); border-radius:10px; margin-bottom:8px; }
        .comment-header { display:flex; align-items:center; gap:10px; font-size:0.7rem; color:var(--text-muted); }
        .comment-time-box { padding:2px 8px; border-radius:10px; font-size:0.65rem; background:rgba(255,255,255,0.04); border:1px solid var(--border-subtle); display:flex; align-items:center; gap:4px; }
        .comment-time-box.green { border-color:#10b981; color:#10b981; }
        .comment-time-box.blue { border-color:#38bdf8; color:#38bdf8; }
        .comment-body { font-size:0.85rem; }
        .comment-vote-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:8px; font-size:0.7rem; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    <div id="toastContainer" style="position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:6px; pointer-events:none;"></div>

    <div class="app-container">
        <header class="header">
            <div class="logo-area" onclick="goHome()" title="Home">
                <div class="logo-icon"><i class="fa-solid fa-chart-line"></i></div>
                <span class="logo-text">Sentix<span class="logo-dot"></span></span>
            </div>
            <div class="header-stats">
                <div class="stat-item" onclick="setFilterTab('live')">🔴 Live <span class="val" id="liveCount">0</span></div>
                <div class="stat-item" onclick="setFilterTab('ended')">⚫ Ended <span class="val" id="endedCount">0</span></div>
                <div class="stat-item">🗳️ Total <span class="val" id="totalVotesCount">0</span></div>
            </div>
            <button class="btn-icon btn-primary" onclick="toggleCreateForm()">+ New Poll</button>
        </header>

        <div class="create-form" id="createForm">
            <div class="create-card">
                <h3><i class="fa-solid fa-pen-to-square" style="color:var(--accent);"></i> New Poll</h3>
                <div class="form-group"><label>Question</label><input class="form-input" id="pollQuestion" placeholder="What's your question?"></div>
                <div class="form-group"><label>Context</label><textarea class="form-input" id="pollContext" rows="2"></textarea></div>
                <div style="display:flex; gap:12px;"><div class="form-group"><label>Expires at</label><input class="form-input" type="datetime-local" id="pollExpiration"></div><div class="form-group"><label>Media URL</label><input class="form-input" id="pollMedia" placeholder="Image or YouTube"></div></div>
                <div class="form-group"><label>Options</label><div class="options-list" id="optionsContainer"></div><button class="add-option-btn" onclick="addOption()"><i class="fa-solid fa-plus"></i> Add option</button></div>
                <div style="display:flex; gap:10px; margin-top:20px;"><button class="btn-publish" onclick="createPoll()">Publish</button><button class="btn-cancel-form" onclick="closeCreateForm()">Cancel</button></div>
            </div>
        </div>

        <div id="mainView"></div>
        <div class="history-section">
            <div style="font-size:0.8rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">📋 Polls</div>
            <div class="tab-bar">
                <button class="tab active" id="tabLive" onclick="setFilterTab('live')">Live</button>
                <button class="tab" id="tabEnded" onclick="setFilterTab('ended')">Ended</button>
                <div class="sort-search">
                    <select class="sort-select" id="sortSelect" onchange="applyFilter()"><option value="recent">Recent</option><option value="oldest">Oldest</option><option value="shortest">Shortest</option><option value="longest">Longest</option></select>
                    <input class="search-input" id="searchInput" placeholder="Search..." oninput="applyFilter()">
                </div>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Signature modal -->
    <div id="signatureModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h4>Confirm your vote: <span id="sigOptionName"></span></h4>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Optionally add a comment.</p>
            <input class="signature-input" type="text" id="sigText" placeholder="TSignature – text comment">
            <input class="signature-input" type="text" id="sigMedia" placeholder="ISignature – image/video URL">
            <div style="margin-top:12px;">
                <div style="font-size:0.75rem; color:var(--text-secondary); margin-bottom:6px;">Choose wisely:</div>
                <div class="visibility-row" id="visibilityRow">
                    <button class="vis-toggle public active" data-vis="public">Public</button>
                    <button class="vis-toggle private" data-vis="private">Private</button>
                    <button class="vis-toggle postpoll" data-vis="postpoll">Public post‑poll</button>
                </div>
            </div>
            <div class="vmark-toggle" style="margin-top:12px;">
                <button class="vmark-btn active" id="vmarkBtn" onclick="toggleVmark()">Vmark: show my vote</button>
                <span style="font-size:0.7rem; color:var(--text-muted);">(only when comment is public)</span>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel-modal" onclick="closeSignatureModal()">Cancel</button>
                <button class="btn-confirm" onclick="submitSignatureVote()">Confirm Vote</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyB5vn-Fj6XpzzBsSBzBR2G4HGpmTQwV2-E",
  authDomain: "sentix-eeca0.firebaseapp.com",
  databaseURL: "https://sentix-eeca0-default-rtdb.firebaseio.com",
  projectId: "sentix-eeca0",
  storageBucket: "sentix-eeca0.firebasestorage.app",
  messagingSenderId: "289213404201",
  appId: "1:289213404201:web:51a9e37f2fff18abc0f838",
  measurementId: "G-NJXW4HGQGX"
};
            // --------------------------------------------------------------

            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            const voterId = (() => {
                let id = localStorage.getItem('sentix_voter');
                if (!id) { id = 'v_' + Math.random().toString(36).substr(2,10); localStorage.setItem('sentix_voter', id); }
                return id;
            })();

            const DEFAULT_COLORS = ['#10b981','#ef4444','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#14b8a6','#6366f1'];
            let allPolls = [], selectedPollId = null, filterTab = 'live', sortBy = 'recent', searchQuery = '', countdownInterval = null;
            let pendingVote = { pollId: null, option: null };
            let currentVisibility = 'public';
            let currentShowVote = true;

            // ---- Creation form helpers ----
            function initOptions() {
                const container = document.getElementById('optionsContainer');
                container.innerHTML = '';
                addOptionRow('Bullish', DEFAULT_COLORS[0]);
                addOptionRow('Bearish', DEFAULT_COLORS[1]);
                addOptionRow('Neutral', DEFAULT_COLORS[2]);
            }
            function addOptionRow(value = '', color = null) {
                const container = document.getElementById('optionsContainer');
                const idx = container.children.length;
                const col = color || DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
                const row = document.createElement('div');
                row.className = 'option-item';
                row.innerHTML = `<div class="option-color-dot" style="background:${col};"></div>
                    <input class="option-input" value="${escapeHtml(value)}" placeholder="Option ${idx+1}">
                    <button class="remove-option-btn" onclick="removeOption(this)"><i class="fa-solid fa-xmark"></i></button>`;
                container.appendChild(row);
            }
            window.addOption = () => addOptionRow();
            window.removeOption = (btn) => {
                if (document.getElementById('optionsContainer').children.length > 1) btn.parentElement.remove();
                else showToast('Need at least one option.');
            };
            function getOptionsData() {
                const inputs = document.querySelectorAll('.option-input');
                const options = [], colors = [];
                inputs.forEach((inp, i) => {
                    const val = inp.value.trim();
                    if (val) {
                        options.push(val);
                        const dot = inp.parentElement.querySelector('.option-color-dot');
                        colors.push(dot ? dot.style.background : DEFAULT_COLORS[i % DEFAULT_COLORS.length]);
                    }
                });
                return { options, colors };
            }

            function showToast(msg) {
                const t = document.createElement('div'); t.textContent=msg;
                t.style.cssText='padding:10px 18px;border-radius:20px;font-weight:600;background:rgba(16,185,129,0.9);color:#fff;';
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(()=>t.remove(), 2500);
            }

            window.toggleCreateForm = () => {
                const form = document.getElementById('createForm');
                if (form.style.display === 'block') closeCreateForm();
                else {
                    form.style.display = 'block';
                    initOptions();
                    document.getElementById('pollQuestion').focus();
                    const exp = document.getElementById('pollExpiration');
                    if (!exp.value) exp.value = new Date(Date.now()+86400000).toISOString().slice(0,16);
                }
            };
            window.closeCreateForm = () => {
                document.getElementById('createForm').style.display = 'none';
                document.getElementById('pollQuestion').value = '';
                document.getElementById('pollContext').value = '';
                document.getElementById('pollMedia').value = '';
            };

            window.createPoll = function() {
                const q = document.getElementById('pollQuestion').value.trim();
                const expVal = document.getElementById('pollExpiration').value;
                if (!q || !expVal) return showToast('Fill required fields.');
                const expDate = new Date(expVal);
                if (expDate <= new Date()) return showToast('Expiration must be in the future.');
                const { options, colors } = getOptionsData();
                if (options.length === 0) return showToast('Add at least one option.');

                let mediaType=null, mediaUrl=null;
                const media = document.getElementById('pollMedia').value.trim();
                if (media) {
                    const yt = media.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
                    if (yt) { mediaType='youtube'; mediaUrl='https://www.youtube.com/embed/'+yt[1]; }
                    else if (/\.(jpg|jpeg|png|gif|webp)$/i.test(media)) { mediaType='image'; mediaUrl=media; }
                }

                const ref = db.ref('polls').push();
                ref.set({
                    title: q, description: document.getElementById('pollContext').value.trim(),
                    expiration: expDate.toISOString(), mediaType, mediaUrl,
                    options, optionColors: colors,
                    createdAt: firebase.database.ServerValue.TIMESTAMP, counts: {}
                }).then(() => {
                    selectedPollId = ref.key;
                    updateUrl(ref.key);
                    closeCreateForm();
                    showToast('Poll published!');
                }).catch(e => showToast('Error: '+e.message));
            };

            // ---- Voting & signatures ----
            window.openSignatureModal = function(pollId, optionName) {
                pendingVote = { pollId, option: optionName };
                document.getElementById('sigOptionName').textContent = optionName;
                document.getElementById('sigText').value = '';
                document.getElementById('sigMedia').value = '';
                currentVisibility = 'public';
                currentShowVote = true;
                document.querySelectorAll('.vis-toggle').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.vis === 'public') btn.classList.add('active');
                });
                document.getElementById('vmarkBtn').classList.add('active');
                document.getElementById('signatureModal').style.display = 'flex';
            };
            window.closeSignatureModal = () => {
                document.getElementById('signatureModal').style.display = 'none';
                pendingVote = {};
            };
            window.toggleVmark = () => {
                currentShowVote = !currentShowVote;
                document.getElementById('vmarkBtn').classList.toggle('active', currentShowVote);
            };
            // Visibility toggle listeners
            document.querySelectorAll('.vis-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.vis-toggle').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentVisibility = btn.dataset.vis;
                });
            });

            window.submitSignatureVote = function() {
                const text = document.getElementById('sigText').value.trim();
                const media = document.getElementById('sigMedia').value.trim();
                finalizeVote(pendingVote.pollId, pendingVote.option, text, media, currentVisibility, currentShowVote);
                closeSignatureModal();
            };

            function finalizeVote(pollId, optionName, textSig, mediaSig, visibility, showVote) {
                const ref = db.ref('polls/'+pollId);
                ref.transaction(data => {
                    if (!data || new Date(data.expiration) < new Date()) return;
                    if (data.voterChoices && data.voterChoices[voterId]) return;
                    if (!data.counts) data.counts = {};
                    if (!data.voterChoices) data.voterChoices = {};
                    data.counts[optionName] = (data.counts[optionName]||0) + 1;
                    data.voterChoices[voterId] = {
                        choice: optionName,
                        textSignature: textSig,
                        mediaSignature: mediaSig,
                        visibility: visibility,
                        showVote: showVote,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    };
                    return data;
                }, (err, committed) => {
                    if (err) showToast('Vote failed.');
                    else if (!committed) showToast('Already voted or poll ended.');
                    else showToast('Vote recorded!');
                });
            }

            window.castVote = function(pollId, optionName) {
                const poll = allPolls.find(p=>p.id===pollId);
                if (!poll || new Date(poll.expiration) < new Date()) return showToast('Poll ended.');
                if (poll.voterChoices && poll.voterChoices[voterId]) return showToast('Already voted.');
                openSignatureModal(pollId, optionName);
            };

            // ---- Share & navigation ----
            window.copyShareLink = (pollId) => {
                const url = new URL(window.location);
                url.searchParams.set('poll', pollId);
                navigator.clipboard.writeText(url.href).then(()=>showToast('🔗 Link copied!'));
            };
            window.goHome = () => { selectedPollId = null; clearUrl(); renderAll(); };
            function updateUrl(id) { const u = new URL(window.location); u.searchParams.set('poll', id); history.replaceState({}, '', u); }
            function clearUrl() { const u = new URL(window.location); u.searchParams.delete('poll'); history.replaceState({}, '', u); }

            // ---- Filters ----
            window.setFilterTab = (tab) => {
                filterTab = tab;
                document.getElementById('tabLive').classList.toggle('active', tab==='live');
                document.getElementById('tabEnded').classList.toggle('active', tab==='ended');
                applyFilter();
            };
            window.applyFilter = () => {
                sortBy = document.getElementById('sortSelect').value;
                searchQuery = document.getElementById('searchInput').value.toLowerCase();
                renderHistory();
            };

            function getFilteredPolls() {
                let filtered = allPolls.filter(p => {
                    const live = new Date(p.expiration) >= new Date();
                    if (filterTab==='live' && !live) return false;
                    if (filterTab==='ended' && live) return false;
                    if (searchQuery && !p.title.toLowerCase().includes(searchQuery)) return false;
                    return true;
                });
                const dur = p => new Date(p.expiration) - new Date(p.createdAt);
                if (sortBy==='recent') filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
                else if (sortBy==='oldest') filtered.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
                else if (sortBy==='shortest') filtered.sort((a,b)=>dur(a)-dur(b));
                else if (sortBy==='longest') filtered.sort((a,b)=>dur(b)-dur(a));
                return filtered;
            }

            function getElapsed(ts) {
                if (!ts) return '';
                const diff = Date.now() - ts, s=Math.floor(diff/1000), m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24);
                if (s<60) return 'just now';
                if (m<60) return m+'m ago';
                if (h<24) return h+'h ago';
                if (d<7) return d+'d ago';
                if (d<30) return Math.floor(d/7)+'w ago';
                if (d<365) return Math.floor(d/30)+'mo ago';
                return Math.floor(d/365)+'y ago';
            }
            function getDurationShort(p) {
                const sec = (new Date(p.expiration) - new Date(p.createdAt))/1000;
                if (sec<60) return Math.round(sec)+'s';
                if (sec<3600) return Math.round(sec/60)+'m';
                if (sec<86400) return Math.round(sec/3600)+'h';
                if (sec<604800) return Math.round(sec/86400)+'d';
                if (sec<2592000) return Math.round(sec/604800)+'w';
                if (sec<31536000) return Math.round(sec/2592000)+'mo';
                return Math.round(sec/31536000)+'y';
            }

            function renderMainView() {
                const container = document.getElementById('mainView');
                if (selectedPollId) {
                    const poll = allPolls.find(p=>p.id===selectedPollId);
                    if (!poll) { container.innerHTML='<div class="welcome-card">Poll not found.</div>'; return; }
                    const options = poll.options||[], colors = poll.optionColors||[], counts = poll.counts||{};
                    const total = Object.values(counts).reduce((a,b)=>a+b,0);
                    const expired = new Date(poll.expiration) < new Date();
                    const voterData = poll.voterChoices?.[voterId];
                    const hasVoted = !!voterData;
                    const disabled = expired || hasVoted;
                    let mediaHtml = '';
                    if (poll.mediaType==='image' && poll.mediaUrl) mediaHtml=`<img src="${escapeHtml(poll.mediaUrl)}" style="max-width:100%; border-radius:12px;">`;
                    else if (poll.mediaType==='youtube' && poll.mediaUrl) mediaHtml=`<iframe src="${escapeHtml(poll.mediaUrl)}" style="width:100%; height:300px;"></iframe>`;

                    const voteBtns = options.map((opt,i) => {
                        const color = colors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
                        return `<button class="vote-btn" style="border-color:${color}; color:${color};" onclick="castVote('${poll.id}','${escapeHtml(opt)}')" ${disabled?'disabled':''}>
                            <span class="option-dot" style="background:${color};"></span> ${escapeHtml(opt)}
                        </button>`;
                    }).join('');

                    const resultBars = options.map((opt,i) => {
                        const count = counts[opt]||0, pct = total ? Math.round(count/total*100) : 0;
                        const color = colors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
                        return `<div class="result-row">
                            <span class="result-label" style="color:${color};"><span class="option-dot" style="background:${color};"></span> ${escapeHtml(opt)}</span>
                            <div class="result-bar-bg"><div class="result-bar-fill" style="width:${pct}%; --fill-color:${color}; --fill-color-dark:${color};"></div></div>
                            <span class="result-percent" style="color:${color};">${pct}%</span>
                        </div>`;
                    }).join('');

                    const expiryDate = new Date(poll.expiration).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
                    const closedText = expired ? `📅 Closed on ${expiryDate}` : '';

                    // Build comments section
                    const commentsHtml = renderCommentsSection(poll);

                    container.innerHTML = `
                    <div class="poll-card">
                        <div class="poll-meta">
                            <span class="badge ${expired?'badge-ended':'badge-live'}">${expired?'ENDED':'LIVE'}</span>
                            <span>${expired ? closedText : '⏳ ' + getCountdown(poll.expiration)}</span>
                            <span style="flex:1;"></span>
                            <button class="btn-icon" onclick="copyShareLink('${poll.id}')">🔗 Share</button>
                        </div>
                        <h2>${escapeHtml(poll.title)}</h2>
                        ${poll.description ? `<p style="color:var(--text-secondary);">${escapeHtml(poll.description)}</p>` : ''}
                        ${mediaHtml ? `<div style="margin:12px 0;">${mediaHtml}</div>` : ''}
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin:16px 0;">${voteBtns}</div>
                        ${total>0 ? `<div class="results-area">${resultBars}</div>` : '<div style="color:var(--text-muted);">No votes yet.</div>'}
                        ${hasVoted ? `<div style="margin-top:8px;">✅ You voted <strong>${escapeHtml(voterData.choice)}</strong></div>` : ''}
                        ${commentsHtml}
                    </div>`;
                    if (!expired) startCountdown(poll.expiration);
                } else {
                    const liveC = allPolls.filter(p=>new Date(p.expiration)>=new Date()).length;
                    container.innerHTML = `
                    <div class="welcome-card">
                        <h1>📊 Sentix</h1>
                        <p>Create custom polls with any options you want. Vote, share, and see live results.</p>
                        <div style="display:flex; gap:20px; justify-content:center; margin:20px 0;">
                            <div><strong>${liveC}</strong> live</div><div><strong>${allPolls.length-liveC}</strong> ended</div>
                            <div><strong>${allPolls.reduce((s,p)=>s+Object.values(p.counts||{}).reduce((a,b)=>a+b,0),0)}</strong> votes</div>
                        </div>
                        <button class="btn-explore" onclick="setFilterTab('live');document.getElementById('historyList').scrollIntoView({behavior:'smooth'});">Explore Live Polls</button>
                    </div>`;
                }
            }

            function renderCommentsSection(poll) {
                const comments = [];
                if (poll.voterChoices) {
                    const isExpired = new Date(poll.expiration) < new Date();
                    Object.entries(poll.voterChoices).forEach(([vid, data]) => {
                        if (vid === voterId || data.visibility === 'public' || (data.visibility === 'postpoll' && isExpired)) {
                            comments.push({ ...data, voterId: vid });
                        }
                    });
                }
                comments.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
                let commentsList = '';
                comments.forEach(c => {
                    const shortId = c.voterId.slice(0,10);
                    const absTime = c.timestamp ? new Date(c.timestamp).toLocaleString() : '';
                    const relTime = c.timestamp ? getElapsed(c.timestamp) : '';
                    const showChoice = c.showVote && (c.visibility !== 'private');
                    let choiceHtml = '';
                    if (showChoice) {
                        const color = poll.optionColors?.[poll.options?.indexOf(c.choice)] || DEFAULT_COLORS[0];
                        choiceHtml = `<span class="comment-vote-badge" style="border:1px solid ${color}; color:${color};"><span class="option-dot" style="background:${color};"></span> ${escapeHtml(c.choice)}</span>`;
                    }
                    commentsList += `
                    <div class="comment-entry">
                        <div class="comment-header">
                            <span>${shortId}</span>
                            <div class="comment-time-box green">${absTime}</div>
                            <div class="comment-time-box blue">${relTime}</div>
                            ${choiceHtml}
                        </div>
                        ${c.textSignature ? `<div class="comment-body">💬 ${escapeHtml(c.textSignature)}</div>` : ''}
                        ${c.mediaSignature ? `<div class="comment-body">🖼️ <a href="${escapeHtml(c.mediaSignature)}" target="_blank" style="color:var(--accent);">View media</a></div>` : ''}
                    </div>`;
                });
                const count = comments.length;
                return `
                <button class="comments-toggle-btn" onclick="toggleComments('${poll.id}')">💬 Comments (${count})</button>
                <div class="comments-section" id="comments-${poll.id}" style="display:none;">
                    ${commentsList || '<div style="color:var(--text-muted);">No public comments yet.</div>'}
                </div>`;
            }

            window.toggleComments = function(pollId) {
                const el = document.getElementById('comments-'+pollId);
                if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
            };

            function renderHistory() {
                const list = document.getElementById('historyList');
                const filtered = getFilteredPolls();
                if (!filtered.length) { list.innerHTML='<div style="text-align:center;padding:20px;">No polls.</div>'; return; }
                list.innerHTML = filtered.map(p => {
                    const options = p.options||[], colors = p.optionColors||[], counts = p.counts||{};
                    const total = Object.values(counts).reduce((a,b)=>a+b,0);
                    const percentMap = options.map((opt,i) => ({
                        name: opt, color: colors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length],
                        pct: total ? Math.round((counts[opt]||0)/total*100) : 0
                    })).sort((a,b)=>b.pct - a.pct);
                    const top2 = percentMap.slice(0,2);
                    return `
                    <div class="history-item" onclick="viewPoll('${p.id}')">
                        <div class="hi-left">
                            <span class="hi-title">${escapeHtml(p.title)}</span>
                            <span class="hi-time" data-timestamp="${p.createdAt}">${getElapsed(p.createdAt)}</span>
                        </div>
                        <div class="hi-duration-badge">${getDurationShort(p)}</div>
                        <div class="hi-sentiments">
                            ${top2.map(o => `
                                <div class="sentiment-badge">
                                    <span class="sentiment-dot" style="background:${o.color};"></span>
                                    <span style="color:${o.color};">${o.name} ${o.pct}%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                }).join('');
                document.querySelectorAll('.hi-time').forEach(el => {
                    const ts = parseInt(el.dataset.timestamp);
                    if (ts) el.textContent = getElapsed(ts);
                });
            }

            window.viewPoll = (id) => { selectedPollId = id; updateUrl(id); renderAll(); document.getElementById('mainView').scrollIntoView({behavior:'smooth'}); };

            function startCountdown(exp) {
                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    const badge = document.querySelector('.poll-card .badge-countdown');
                    if (badge) badge.textContent = '⏳ ' + getCountdown(exp);
                    if (new Date(exp) < new Date()) { clearInterval(countdownInterval); renderAll(); }
                }, 1000);
            }

            function getCountdown(exp) {
                const d = new Date(exp) - new Date();
                if (d<=0) return 'Ended';
                const s=Math.floor(d/1000), m=Math.floor(s/60), h=Math.floor(m/60), days=Math.floor(h/24);
                if(days) return days+'d '+h%24+'h';
                if(h) return h+'h '+m%60+'m';
                if(m) return m+'m '+s%60+'s';
                return s+'s';
            }

            function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

            function renderAll() {
                renderMainView();
                renderHistory();
                const liveC = allPolls.filter(p=>new Date(p.expiration)>=new Date()).length;
                document.getElementById('liveCount').textContent = liveC;
                document.getElementById('endedCount').textContent = allPolls.length - liveC;
                document.getElementById('totalVotesCount').textContent = allPolls.reduce((s,p)=>s+Object.values(p.counts||{}).reduce((a,b)=>a+b,0),0);
            }

            // Firebase sync
            db.ref('polls').on('value', snap => {
                const data = snap.val();
                allPolls = [];
                if (data) Object.keys(data).forEach(k => allPolls.push({id:k, ...data[k]}));
                allPolls.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
                renderAll();
            });

            // URL init
            const urlPoll = new URLSearchParams(window.location.search).get('poll');
            selectedPollId = urlPoll || null;

            // Time refresher
            setInterval(() => {
                document.querySelectorAll('.hi-time').forEach(el => {
                    const ts = parseInt(el.dataset.timestamp);
                    if (ts) el.textContent = getElapsed(ts);
                });
            }, 30000);

            initOptions();
        })();
    </script>
</body>
    </html>
