<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentix</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #060b14;
            --bg-secondary: #0b1221;
            --bg-card: #0f1729;
            --bg-card-hover: #131d33;
            --border-subtle: rgba(255,255,255,0.06);
            --border-medium: rgba(255,255,255,0.12);
            --border-active: rgba(56,189,248,0.4);
            --text-primary: #e8ecf2;
            --text-secondary: #9aa4b8;
            --text-muted: #5f6b80;
            --accent: #38bdf8;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --purple: #a855f7;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-card: 0 4px 32px rgba(0,0,0,0.45);
            --shadow-elevated: 0 12px 48px rgba(0,0,0,0.6);
        }
        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --border-subtle: rgba(0,0,0,0.06);
            --border-medium: rgba(0,0,0,0.10);
            --border-active: rgba(56,189,248,0.5);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-elevated: 0 12px 40px rgba(0,0,0,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-size:16px; }
        body {
            font-family:'Inter', system-ui, -apple-system, sans-serif;
            background:var(--bg-primary); color:var(--text-primary);
            min-height:100vh; overflow-x:hidden; line-height:1.5;
            transition: background 0.3s, color 0.3s;
        }
        .bg-pattern { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.12;
            background-image: radial-gradient(circle at 25% 25%, rgba(56,189,248,0.08) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(16,185,129,0.06) 0%, transparent 50%);
        }
        .app-container { position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 16px 60px; }

        .compact-header {
            position:sticky; top:0; z-index:100;
            background:var(--bg-card); border-bottom:1px solid var(--border-subtle);
            backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
            padding:8px 14px; margin-bottom:14px;
            border-radius:0 0 var(--radius-lg) var(--radius-lg);
            box-shadow:var(--shadow-elevated);
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
        }
        .logo { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
        .logo i { font-size:1.2rem; color:var(--accent); }
        .logo span { font-weight:800; font-size:1.1rem; letter-spacing:-0.3px;
            background:linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .pwr-wrapper { position:relative; }
        .pwr-badge {
            display:flex; align-items:center; gap:5px; padding:5px 12px;
            border-radius:16px; font-weight:700; font-size:0.78rem; cursor:pointer;
            background:rgba(168,85,247,0.12); border:1px solid rgba(168,85,247,0.3); color:#a855f7;
            font-family:'JetBrains Mono', monospace; transition:all 0.2s;
        }
        .pwr-badge:hover { background:rgba(168,85,247,0.22); box-shadow:0 0 20px rgba(168,85,247,0.2); }
        .pwr-bar {
            position:absolute; bottom:0; left:0; height:3px; border-radius:0 0 16px 16px;
            background:linear-gradient(90deg, #a855f7, #c084fc); transition:width 0.5s;
        }
        .icon-btn {
            width:34px; height:34px; border-radius:50%; border:1px solid var(--border-medium);
            background:var(--bg-secondary); color:var(--text-secondary); cursor:pointer;
            display:flex; align-items:center; justify-content:center; font-size:0.9rem;
            transition: all 0.2s;
        }
        .icon-btn:hover { border-color:var(--accent); color:var(--accent); box-shadow:0 0 16px rgba(56,189,248,0.15); }
        .btn { padding:8px 16px; border-radius:20px; font-weight:600; font-size:0.82rem; cursor:pointer;
            border:1px solid var(--border-medium); background:var(--bg-secondary); color:var(--text-primary);
            transition:all 0.2s; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
        }
        .btn:hover { border-color:var(--border-active); box-shadow:0 4px 16px rgba(0,0,0,0.2); }
        .btn-accent { background:linear-gradient(135deg, #1e3a5f, #1a3355); border-color:rgba(56,189,248,0.35); color:#e0f0ff; }
        .btn-green { background:linear-gradient(135deg, #10b981, #059669); border:none; color:#fff; }
        .btn-red { background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.3); color:#ef4444; }

        .stats-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
        .stat-card {
            flex:1; min-width:80px; background:var(--bg-card); border:2px solid var(--border-subtle);
            border-radius:var(--radius-md); padding:14px 12px; text-align:center;
            cursor:pointer; transition:all 0.25s; box-shadow:0 2px 12px rgba(0,0,0,0.15);
        }
        .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-elevated); border-color:var(--border-active); }
        .stat-card.active { border-color:var(--accent); background:rgba(56,189,248,0.06); }
        .stat-card.live .num { color:var(--red); } .stat-card.ended .num { color:var(--text-muted); }
        .stat-card.votes .num { color:var(--accent); }
        .stat-card .num { font-size:1.5rem; font-weight:800; font-family:'JetBrains Mono', monospace; }
        .stat-card .lbl { font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin-top:3px; }
        .live-dot { width:8px; height:8px; border-radius:50%; background:var(--red); display:inline-block; margin-right:4px; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        .banner-card {
            background:var(--bg-card); border:1px solid var(--border-medium); border-radius:var(--radius-lg);
            padding:16px 18px; margin-bottom:14px; position:relative; box-shadow:var(--shadow-card);
            display:none;
        }
        .banner-close { position:absolute; top:8px; right:12px; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem; }
        .banner-close:hover { color:var(--red); }

        /* Global Search Bar */
        .global-search { margin-bottom:12px; }
        .global-search input {
            width:100%; padding:10px 16px; border-radius:var(--radius-lg); font-size:0.88rem;
            background:var(--bg-card); border:1px solid var(--border-medium);
            color:var(--text-primary); outline:none; transition:border-color 0.2s;
        }
        .global-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,0.08); }

        .filter-bar { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
        .tab { padding:7px 15px; border-radius:16px; font-size:0.78rem; font-weight:600; cursor:pointer; border:1px solid var(--border-medium); background:transparent; color:var(--text-secondary); transition:all 0.2s; }
        .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .tab:hover:not(.active) { border-color:var(--border-active); color:var(--text-primary); }
        .sort-group { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; }
        select {
            padding:7px 10px; border-radius:14px; font-size:0.75rem;
            background:var(--bg-secondary); border:1px solid var(--border-medium);
            color:var(--text-primary); outline:none; font-family:'Inter', sans-serif;
            transition:border-color 0.2s;
        }
        select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,0.08); }

        .poll-card { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:20px 18px; margin-bottom:14px; box-shadow:var(--shadow-card); }
        .skeleton { background:linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card-hover) 50%, var(--bg-secondary) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:var(--radius-md); height:120px; margin-bottom:14px; }
        @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
        .poll-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; font-size:0.72rem; color:var(--text-muted); font-family:'JetBrains Mono', monospace; }
        .badge { padding:3px 9px; border-radius:10px; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; }
        .badge-live { background:rgba(239,68,68,0.2); color:#ef4444; border:1px solid rgba(239,68,68,0.25); }
        .badge-ended { background:rgba(107,114,128,0.12); color:#6b7280; border:1px solid rgba(107,114,128,0.2); }
        .info-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .info-pill { padding:4px 10px; border-radius:12px; font-size:0.66rem; font-weight:600; font-family:'JetBrains Mono', monospace; display:flex; align-items:center; gap:4px; }
        .info-pill.time { background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2); color:#10b981; }
        .info-pill.date { background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.2); color:#f59e0b; }
        .info-pill.pwr { background:rgba(168,85,247,0.08); border:1px solid rgba(168,85,247,0.2); color:#a855f7; }
        .poll-title { font-size:1.25rem; font-weight:700; margin-bottom:4px; }
        .poll-media { margin:10px 0; border-radius:var(--radius-md); overflow:hidden; max-height:300px; }
        .vote-grid { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
        .vote-btn { flex:1; min-width:90px; padding:12px 10px; border-radius:var(--radius-sm); font-weight:700; font-size:0.85rem; cursor:pointer; border:2px solid; text-align:center; transition:all 0.2s; background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:center; gap:6px; }
        .vote-btn:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.3); }
        .vote-btn:disabled { opacity:0.45; cursor:not-allowed; }
        .results { margin-top:10px; }
        .result-row { display:flex; align-items:center; margin-bottom:8px; gap:10px; font-size:0.82rem; }
        .result-name { min-width:80px; font-weight:700; }
        .result-track { flex:1; height:16px; background:rgba(128,128,128,0.06); border-radius:8px; overflow:hidden; }
        .result-fill { height:100%; border-radius:8px; transition:width 0.6s ease; }
        .result-pct { font-weight:700; min-width:38px; text-align:right; font-family:'JetBrains Mono', monospace; font-size:0.78rem; }
        .history-item { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
        .history-item:hover { background:var(--bg-card-hover); border-color:var(--border-medium); transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.2); }
        .hi-circle { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:700; font-family:'JetBrains Mono', monospace; border:2px solid var(--border-medium); color:var(--text-secondary); background:rgba(255,255,255,0.02); }
        .hi-main { flex:1; min-width:120px; }
        .hi-title { font-weight:600; font-size:0.88rem; }
        .hi-sub { font-size:0.65rem; color:var(--text-muted); font-family:'JetBrains Mono', monospace; }
        .hi-top3 { display:flex; gap:5px; align-items:center; font-size:0.64rem; font-weight:600; }
        .hi-dot { width:7px; height:7px; border-radius:2px; display:inline-block; }
        .comment-item { padding:10px 12px; background:rgba(128,128,128,0.03); border-radius:var(--radius-sm); margin-bottom:6px; border:1px solid var(--border-subtle); }
        .comment-meta { font-size:0.66rem; color:var(--text-muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-family:'JetBrains Mono', monospace; }
        .like-btn { background:none; border:none; cursor:pointer; padding:3px 7px; border-radius:6px; font-size:0.82rem; color:var(--text-muted); transition:all 0.15s; }
        .like-btn:hover { background:rgba(128,128,128,0.1); }
        .like-btn.active-like { color:var(--green); background:rgba(16,185,129,0.1); }
        .like-btn.active-dislike { color:var(--red); background:rgba(239,68,68,0.1); }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(8px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-box { background:var(--bg-card); border:1px solid var(--border-medium); border-radius:var(--radius-lg); padding:0; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 24px 80px rgba(0,0,0,0.7); }
        .modal-header { padding:20px 22px 14px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg-card); z-index:5; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
        .modal-header h3 { font-weight:700; font-size:1.05rem; }
        .modal-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem; padding:4px 8px; border-radius:6px; }
        .modal-body { padding:18px 22px; }
        .modal-footer { padding:14px 22px 20px; border-top:1px solid var(--border-subtle); display:flex; gap:10px; justify-content:flex-end; position:sticky; bottom:0; background:var(--bg-card); z-index:5; border-radius:0 0 var(--radius-lg) var(--radius-lg); }

        .fee-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:10px 14px; border-radius:var(--radius-sm); margin-bottom:14px; font-size:0.78rem; font-weight:600; background:rgba(168,85,247,0.08); border:1px solid rgba(168,85,247,0.25); color:var(--purple); }
        .fee-bar.warning { background:rgba(245,158,11,0.1); border-color:rgba(245,158,11,0.35); color:var(--amber); }

        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); margin-bottom:5px; }
        .form-input { width:100%; padding:10px 13px; border-radius:var(--radius-sm); font-size:0.88rem; background:var(--bg-secondary); border:1px solid var(--border-medium); color:var(--text-primary); outline:none; }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,0.08); }
        textarea.form-input { resize:vertical; min-height:60px; }

        .exp-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .exp-chip { padding:7px 14px; border-radius:16px; font-size:0.78rem; font-weight:600; cursor:pointer; border:1px solid var(--border-medium); background:transparent; color:var(--text-secondary); }
        .exp-chip:hover { border-color:var(--border-active); color:var(--text-primary); }
        .exp-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }

        .dropzone { border:2px dashed var(--border-medium); border-radius:var(--radius-md); padding:24px 16px; text-align:center; cursor:pointer; transition:all 0.25s; background:rgba(255,255,255,0.01); }
        .dropzone:hover { border-color:var(--accent); background:rgba(56,189,248,0.04); }
        .dropzone.has-preview { padding:8px; }
        .dropzone .dz-icon { font-size:1.8rem; color:var(--text-muted); }
        .dropzone .preview-img { max-width:100%; max-height:200px; border-radius:var(--radius-sm); }
        .dropzone .remove-preview { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.7); border:none; color:#fff; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

        .advanced-toggle { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--text-secondary); padding:8px 0; border-top:1px solid var(--border-subtle); margin-top:10px; }
        .advanced-toggle i { transition:transform 0.3s; }
        .advanced-toggle.open i { transform:rotate(180deg); }
        .advanced-panel { display:none; }
        .advanced-panel.open { display:block; }

        .option-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
        .opt-color-input { width:38px; height:38px; border-radius:8px; border:2px solid var(--border-medium); cursor:pointer; padding:0; }
        .opt-text-input { flex:1; }

        .captcha-box { background:rgba(56,189,248,0.06); border:1px solid rgba(56,189,248,0.2); border-radius:var(--radius-sm); padding:10px 14px; margin:10px 0; display:flex; align-items:center; gap:10px; font-weight:700; }
        .captcha-box input { width:70px; text-align:center; }
        .toggle-switch { width:42px; height:24px; border-radius:12px; background:var(--bg-secondary); border:1px solid var(--border-medium); position:relative; cursor:pointer; }
        .toggle-switch.on { background:var(--green); border-color:var(--green); }
        .toggle-switch::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:all 0.25s; }
        .toggle-switch.on::after { left:20px; }

        .toast { position:fixed; top:20px; right:20px; z-index:2000; padding:10px 18px; border-radius:20px; font-weight:600; background:rgba(16,185,129,0.95); color:#fff; animation:toastIn 0.3s ease; }
        @keyframes toastIn { from{opacity:0;transform:translateX(40px);} to{opacity:1;transform:translateX(0);} }
        .fab { position:fixed; bottom:24px; right:24px; z-index:99; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg, #10b981, #059669); color:#fff; border:none; cursor:pointer; font-size:1.4rem; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(16,185,129,0.3); }
        @media (min-width:768px) { .fab { display:none; } }
        @media (max-width:600px) { .stats-row { gap:6px; } .stat-card .num { font-size:1.2rem; } }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div id="toastRoot" style="position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none;"></div>
    <div id="modalRoot"></div>

    <div class="app-container">
        <div class="compact-header">
            <div class="logo" onclick="goHome()"><i class="fa-solid fa-chart-line"></i><span>Sentix</span></div>
            <div class="header-actions">
                <div class="pwr-wrapper">
                    <span class="pwr-badge" onclick="openPwrPanel()" id="pwrDisplay">⚡ 0.0000</span>
                    <div class="pwr-bar" id="pwrBar" style="width:0%;"></div>
                </div>
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <button class="icon-btn" onclick="openProfile()"><i class="fa-solid fa-user"></i></button>
                <button class="btn btn-accent" onclick="openCreateForm()">+ New Poll</button>
            </div>
        </div>

        <div class="stats-row" id="statsRow">
            <div class="stat-card live active" data-filter="live"><div class="num"><span class="live-dot"></span><span id="liveCount">0</span></div><div class="lbl">Live</div></div>
            <div class="stat-card ended" data-filter="ended"><div class="num" id="endedCount">0</div><div class="lbl">Ended</div></div>
            <div class="stat-card votes" data-filter="votes"><div class="num" id="totalVotesCount">0</div><div class="lbl">Votes</div></div>
        </div>

        <div id="bannerCard" class="banner-card">
            <button class="banner-close" onclick="dismissBanner()">✕</button>
            <div id="bannerContent"></div>
        </div>

        <!-- Global Search -->
        <div class="global-search">
            <input type="search" id="searchInput" placeholder="Search polls across all categories..." oninput="applyFilter()">
        </div>

        <!-- Filter Tabs & Sort -->
        <div class="filter-bar">
            <button class="tab active" data-tab="live">Live</button>
            <button class="tab" data-tab="ended">Ended</button>
            <button class="tab" data-tab="all">All</button>
            <div class="sort-group">
                <select id="sortSelect" onchange="applyFilter()">
                    <option value="recent">⏱️ Recent</option>
                    <option value="oldest">📜 Oldest</option>
                    <option value="mostvoted">🔥 Most Voted</option>
                    <option value="shortest">⏳ Shortest</option>
                    <option value="longest">📅 Longest</option>
                </select>
            </div>
        </div>

        <div id="pollFeed"></div>
    </div>

    <button class="fab" onclick="openCreateForm()"><i class="fa-solid fa-plus"></i></button>

    <script>
        (function() {
            const firebaseConfig = {

            function renderPollCard(poll){ const opts=poll.options||[], cols=poll.optionColors||[], cnts=poll.counts||{}, total=Object.values(cnts).reduce((a,b)=>a+b,0); const expired=new Date(poll.expiration)<new Date(), vd=poll.voterChoices?.[userId], hasVoted=!!vd; let mh=''; if(poll.mediaUrl){ const isVideo=/\.(mp4|webm|mov)/i.test(poll.mediaUrl); mh=isVideo?`<video src="${esc(poll.mediaUrl)}" controls style="max-width:100%;max-height:300px;border-radius:12px;"></video>`:`<img src="${esc(poll.mediaUrl)}" style="max-width:100%;max-height:300px;border-radius:12px;" onerror="this.style.display='none'">`; } const btns=opts.map((o,i)=>`<button class="vote-btn" style="border-color:${cols[i]||COLORS[i%COLORS.length]};color:${cols[i]||COLORS[i%COLORS.length]};" onclick="castVote('${poll.id}','${esc(o)}',${poll.pwrCost||1})" ${expired||hasVoted?'disabled':''}>${esc(o)}</button>`).join(''); const bars=opts.map((o,i)=>{ const cnt=cnts[o]||0, pct=total?Math.round(cnt/total*100):0; const col=cols[i]||COLORS[i%COLORS.length]; return`<div class="result-row"><span class="result-name" style="color:${col};">${esc(o)}</span><div class="result-track"><div class="result-fill" style="width:${pct}%;background:${col};"></div></div><span class="result-pct" style="color:${col};">${pct}%</span></div>`; }).join(''); const cmts=[]; if(poll.comments) Object.entries(poll.comments).forEach(([id,d])=>cmts.push({id,...d})); cmts.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)); let ch=cmts.map(c=>{ const lc=Object.keys(c.likes||{}).length, dc=Object.keys(c.dislikes||{}).length; return`<div class="comment-item"><div class="comment-meta"><span>${(c.userId||'').slice(0,10)}</span><span>${ts(c.timestamp)}</span><span><button class="like-btn${c.likes?.[userId]?' active-like':''}" onclick="toggleLike('${poll.id}','${c.id}','like')">👍 ${lc}</button><button class="like-btn${c.dislikes?.[userId]?' active-dislike':''}" onclick="toggleLike('${poll.id}','${c.id}','dislike')">👎 ${dc}</button></span></div>${c.t             function renderFeed(){
                const feed=document.getElementById('pollFeed');
                if(loading){ feed.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'; return; }
                let filtered = allPolls.slice();
                // Global search overrides category filter
                const query = searchQuery.trim().toLowerCase();
                if (query) {
                    filtered = filtered.filter(p => p.title.toLowerCase().includes(query));
                    // Clear active tab visual (all tabs inactive)
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                } else {
                    // Apply status filter
                    if (activeFilter === 'live') {
                        filtered = filtered.filter(p => new Date(p.expiration) >= new Date());
                    } else if (activeFilter === 'ended') {
                        filtered = filtered.filter(p => new Date(p.expiration) < new Date());
                    } else if (activeFilter === 'votes') {
                        // Show only polls the user voted in
                        filtered = filtered.filter(p => p.voterChoices && p.voterChoices[userId]);
                    }
                    // else 'all' shows everything
                }
                // Sort
                const durFn = p => new Date(p.expiration) - new Date(p.createdAt);
                if (sortBy === 'recent') filtered.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
                else if (sortBy === 'oldest') filtered.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
                else if (sortBy === 'mostvoted') filtered.sort((a,b) => (Object.values(b.counts||{}).reduce((x,y)=>x+y,0)) - (Object.values(a.counts||{}).reduce((x,y)=>x+y,0)));
                else if (sortBy === 'shortest') filtered.sort((a,b) => durFn(a) - durFn(b));
                else if (sortBy === 'longest') filtered.sort((a,b) => durFn(b) - durFn(a));

                feed.innerHTML = filtered.map(p => {
                    const total = Object.values(p.counts||{}).reduce((a,b)=>a+b,0);
                    const opts=p.options||[], cols=p.optionColors||[], cnts=p.counts||{};
                    const pm = opts.map((o,i)=>({name:o,color:cols[i]||COLORS[i%COLORS.length],pct:total?Math.round((cnts[o]||0)/total*100):0})).sort((a,b)=>b.pct-a.pct);
                    const top3 = pm.slice(0,3); const cc = Object.keys(p.comments||{}).length;
                    return `<div class="history-item" onclick="viewPoll('${p.shortId||p.id}')">
                        <div class="hi-circle">${dur(p.createdAt,new Date(p.expiration))}</div>
                        <div class="hi-main"><div class="hi-title">${esc(p.title)}</div><div class="hi-sub">${ts(p.createdAt)} · ${total} votes · ${cc} comments</div></div>
                        <div class="hi-top3">${top3.map(o=>`<span style="color:${o.color};"><span class="hi-dot" style="background:${o.color};"></span> ${o.name} ${o.pct}%</span>`).join(' ')}</div>
                    </div>`;
                }).join('');
            }

            function renderAll(){
                renderFeed();
                const liveCount = allPolls.filter(p=>new Date(p.expiration)>=new Date()).length;
                document.getElementById('liveCount').textContent = liveCount;
                document.getElementById('endedCount').textContent = allPolls.length - liveCount;
                document.getElementById('totalVotesCount').textContent = allPolls.reduce((s,p)=>s+Object.values(p.counts||{}).reduce((a,b)=>a+b,0),0);
                updatePwrUI();
                // Banner: show only if there is a poll with >5 votes and not dismissed
                if (!localStorage.getItem('banner_dismissed')) {
                    const hotPoll = allPolls.find(p => Object.values(p.counts||{}).reduce((a,b)=>a+b,0) > 5);
                    if (hotPoll) {
                        document.getElementById('bannerContent').innerHTML = renderPollCard(hotPoll);
                        document.getElementById('bannerCard').style.display = 'block';
                    } else {
                        document.getElementById('bannerCard').style.display = 'none';
                    }
                }
            }

            window.dismissBanner = function() {
                document.getElementById('bannerCard').style.display = 'none';
                localStorage.setItem('banner_dismissed', '1');
            };
            window.viewPoll = function(id) { activePollId=id; updateUrl(id); const poll=allPolls.find(p=>p.shortId===activePollId||p.id===activePollId); if(poll) document.getElementById('pollFeed').innerHTML=renderPollCard(poll); };
            window.goHome = function() { activePollId=null; clearUrl(); renderAll(); };
            function updateUrl(id){ history.replaceState({},'',`?p=${id}`); }
            function clearUrl(){ history.replaceState({},'',location.pathname); }

            // Tab & stat card event handlers
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    activeFilter = this.dataset.tab;
                    searchQuery = ''; // clear search when changing tabs
                    document.getElementById('searchInput').value = '';
                    applyFilter();
                });
            });
            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', function() {
                    document.querySelectorAll('.stat-card').forEach(s => s.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.dataset.filter;
                    if (filter === 'votes') {
                        activeFilter = 'votes';
                        // deactivate all tabs
                        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    } else {
                        activeFilter = filter;
                        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        const tab = document.querySelector(`.tab[data-tab="${activeFilter}"]`);
                        if (tab) tab.classList.add('active');
                    }
                    searchQuery = '';
                    document.getElementById('searchInput').value = '';
                    applyFilter();
                });
            });

            document.getElementById('searchInput').addEventListener('input', function() {
                searchQuery = this.value;
                applyFilter();
            });
            document.getElementById('sortSelect').addEventListener('change', function() {
                sortBy = this.value;
                applyFilter();
            });

            function applyFilter() { renderFeed(); }

            // Firebase sync
            db.ref('polls').on('value', snap => {
                loading = false;
                const data = snap.val();
                allPolls = [];
                if (data) Object.keys(data).forEach(k => allPolls.push({id:k, ...data[k]}));
                allPolls.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
                if (activePollId) {
                    const poll = allPolls.find(p => p.shortId===activePollId || p.id===activePollId);
                    if (poll) document.getElementById('pollFeed').innerHTML = renderPollCard(poll);
                } else {
                    renderAll();
                }
            });

            const urlPoll = new URLSearchParams(location.search).get('p');
            if (urlPoll) { activePollId = urlPoll; }
            else { activePollId = null; }
            updatePwrUI();
            document.getElementById('pollFeed').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
        })();
    </script>
</body>
